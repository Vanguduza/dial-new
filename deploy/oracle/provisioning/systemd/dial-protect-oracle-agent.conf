# Protect the out-of-band way in. Drop-in for the Oracle Cloud Agent.
#
# Run Command goes through this agent, and it is the path that survives SSH being
# completely broken — a bad firewall rule, a lost key, an sshd that will not start. It is
# the last non-console way into the machine, and it had no memory protection at all.
#
# Larger reservation than sshd because the agent is a Go binary with plugins and a real
# working set. Still small against 1 GB.

[Service]
MemoryMin=128M
MemoryLow=160M
OOMScoreAdjust=-900
