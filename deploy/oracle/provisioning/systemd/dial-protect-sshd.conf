# Protect the primary way in. Drop-in for ssh.service.
#
# WHY THIS EXISTS
#
# Until now the only unit on this host with memory settings was Desktop Commander, and
# they marked it as the preferred thing to kill. SSH and the Oracle agent — the two paths
# that actually get you back into a broken machine — had no protection whatsoever. They
# survived memory pressure by luck of the kernel's own scoring, not by design.
#
# On a 1 GB host, luck is not a plan.
#
# MemoryMin is a RESERVATION: the kernel will not reclaim these pages under pressure, even
# when everything else is being squeezed. OOMScoreAdjust=-900 takes sshd off the table as
# an OOM victim. 64 MB is generous for sshd and small enough to cost nothing.

[Service]
MemoryMin=64M
MemoryLow=96M
OOMScoreAdjust=-900
