name: dial-n8n-dev

services:
  n8n-dev:
    image: docker.n8n.io/n8nio/n8n:2.39.7
    container_name: dial-n8n-dev
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export DB_POSTGRESDB_PASSWORD="$$(cat /run/secrets/db_password)"
        export N8N_ENCRYPTION_KEY="$$(cat /run/secrets/encryption_key)"
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_auth_token)"
        exec /sbin/tini -- /docker-entrypoint.sh
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: 127.0.0.1
      DB_POSTGRESDB_PORT: "${N8N_DEV_DB_TUNNEL_PORT:-15432}"
      DB_POSTGRESDB_DATABASE: dial_n8n_dev
      DB_POSTGRESDB_USER: dial_n8n_dev
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 127.0.0.1
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678/
      WEBHOOK_URL: "${N8N_DEV_WEBHOOK_URL:-http://127.0.0.1:5678/}"
      GENERIC_TIMEZONE: "${DIAL_TIMEZONE:-Africa/Harare}"
      TZ: "${DIAL_TIMEZONE:-Africa/Harare}"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      EXECUTIONS_TIMEOUT: "900"
      EXECUTIONS_TIMEOUT_MAX: "3600"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "${N8N_DEV_CONCURRENCY_LIMIT:-1}"
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      N8N_METRICS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_GIT_NODE_ENABLE_HOOKS: "false"
      N8N_SSRF_PROTECTION_ENABLED: "true"
      N8N_SSRF_BLOCKED_IP_RANGES: default,100.64.0.0/10
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh"]'
    secrets:
      - db_password
      - encryption_key
      - runner_auth_token
    volumes:
      - n8n-dev-state:/home/node/.n8n
      - n8n-dev-transient:/files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    mem_limit: "${N8N_DEV_MEMORY_LIMIT:-1536m}"
    cpus: "${N8N_DEV_CPU_LIMIT:-0.75}"
    pids_limit: 256

  n8n-dev-runner:
    image: n8nio/runners:2.39.7
    container_name: dial-n8n-dev-runner
    restart: unless-stopped
    network_mode: host
    depends_on:
      n8n-dev:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export N8N_RUNNERS_AUTH_TOKEN="$$(cat /run/secrets/runner_auth_token)"
        exec tini -- /usr/local/bin/task-runner-launcher javascript python
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://127.0.0.1:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_MAX_CONCURRENCY: "${N8N_DEV_RUNNER_CONCURRENCY:-1}"
      N8N_RUNNERS_LAUNCHER_LOG_LEVEL: info
      NO_COLOR: "1"
    secrets:
      - runner_auth_token
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: "${N8N_DEV_RUNNER_MEMORY_LIMIT:-512m}"
    cpus: "${N8N_DEV_RUNNER_CPU_LIMIT:-0.25}"
    pids_limit: 128

volumes:
  n8n-dev-state:
    name: dial_n8n_dev_state
  n8n-dev-transient:
    name: dial_n8n_dev_transient

secrets:
  db_password:
    file: "${DIAL_N8N_DEV_SECRETS_DIR:?set DIAL_N8N_DEV_SECRETS_DIR}/db_password"
  encryption_key:
    file: "${DIAL_N8N_DEV_SECRETS_DIR:?set DIAL_N8N_DEV_SECRETS_DIR}/encryption_key"
  runner_auth_token:
    file: "${DIAL_N8N_DEV_SECRETS_DIR:?set DIAL_N8N_DEV_SECRETS_DIR}/runner_auth_token"
