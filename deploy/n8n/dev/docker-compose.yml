# DIAL_N8N_DEV runs on Hermes. PostgreSQL is native on vekl-worker and is
# reachable only through the host-loopback SSH tunnel.
services:
  n8n-dev:
    image: n8nio/n8n:2.39.7
    container_name: dial-n8n-dev
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_DEV_ENCRYPTION_KEY:?generated by bootstrap}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: host.docker.internal
      DB_POSTGRESDB_PORT: ${N8N_DEV_DB_TUNNEL_PORT:-55432}
      DB_POSTGRESDB_DATABASE: dial_n8n_dev
      DB_POSTGRESDB_USER: dial_n8n_dev
      DB_POSTGRESDB_PASSWORD: ${N8N_DEV_DB_PASSWORD:?generated by bootstrap}
      N8N_HOST: ${N8N_DEV_HOST:?set for the DEV estate}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_DEV_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_DEV_WEBHOOK_URL:?set for the DEV estate}
      N8N_EDITOR_BASE_URL: ${N8N_DEV_EDITOR_BASE_URL:?set for the DEV estate}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_DEV_RUNNERS_AUTH_TOKEN:?generated by bootstrap}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_LOG_LEVEL: info
      GENERIC_TIMEZONE: ${DIAL_TIMEZONE:-Africa/Harare}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - n8n-dev-data:/home/node/.n8n
    networks: [n8n-dev, n8n-dev-egress]
    ports:
      - "127.0.0.1:${N8N_DEV_HTTP_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  n8n-dev-runner:
    image: n8nio/runners:2.39.7
    container_name: dial-n8n-dev-runner
    restart: unless-stopped
    depends_on:
      n8n-dev:
        condition: service_healthy
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-dev:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_DEV_RUNNERS_AUTH_TOKEN:?generated by bootstrap}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [n8n-dev]

volumes:
  n8n-dev-data:

networks:
  n8n-dev:
    internal: true
  n8n-dev-egress:
    driver: bridge
