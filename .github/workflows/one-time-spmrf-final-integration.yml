name: One-time SPMRF final integration authorization

on:
  push:
    branches:
      - 'gpt/shared-project-memory-review-fabric-20260921'
    paths:
      - '.github/workflows/one-time-spmrf-final-integration.yml'

permissions:
  contents: write

concurrency:
  group: one-time-spmrf-final-integration
  cancel-in-progress: false

jobs:
  authorize-final-dial-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout final DIAL integration branch
        uses: actions/checkout@v4
        with:
          ref: gpt/hermes-full-commander-chatgpt-control-20260921-clean
          fetch-depth: 0

      - name: Add owner authorization bridge and record Project Truth
        shell: bash
        run: |
          set -euo pipefail

          AUTH="docs/project-state/authorizations/auth-20260921-owner-spmrf-final-integration.json"
          REG="agent-system/registries/SHARED_PROJECT_MEMORY_FABRIC.json"

          test ! -e "$AUTH"

          cat > "$AUTH" <<'JSON'
          {
            "schema_version": 1,
            "authorization_id": "auth-20260921-owner-spmrf-final-integration",
            "project": "dial",
            "authority": "OWNER_EXPLICIT",
            "owner_instruction_sha256": "d9582ce74d9d0e4e76f4c651aae509fc3481046e3d8a3f72bb56419a0508de3b",
            "owner_instruction_excerpt": "Use one shared persistent project memory pool for the two ChatGPT accounts, Claude Code and other harnesses; cache resolved context to reduce token use; make model handovers resume from verified checkpoints instead of rereading projects from scratch; and cross-review each other at real-time checkpoints.",
            "source": {
              "kind": "owner_session_instruction",
              "channel": "chatgpt",
              "request_id": "chatgpt-20260921-spmrf-final-integration",
              "owner_attested": true
            },
            "issued_at_utc": "2026-09-21T06:05:00Z",
            "base_sha": "1405daaa4b21b9ae35374282b191475e5bcc3ff6",
            "branch_scope": "gpt/hermes-full-commander-chatgpt-control-20260921-clean",
            "authorized_paths": [
              "agent-system/orchestration/checkpoint-store.mjs",
              "agent-system/orchestration/commander-automation-client.mjs",
              "agent-system/orchestration/context-broker.mjs",
              "agent-system/orchestration/handoff-builder.mjs",
              "agent-system/orchestration/hermes-runtime-executor.mjs",
              "agent-system/orchestration/project-context-cache.mjs",
              "agent-system/orchestration/project-repository-resolver.mjs",
              "agent-system/orchestration/read-only-review-runner.mjs",
              "agent-system/orchestration/repository-understanding-snapshot.mjs",
              "agent-system/orchestration/review-coordinator.mjs",
              "agent-system/orchestration/review-fabric.mjs",
              "agent-system/orchestration/shared-context-resolver.mjs",
              "agent-system/orchestration/shared-memory-mcp.mjs",
              "agent-system/orchestration/shared-project-memory.mjs",
              "agent-system/orchestration/state-store.mjs",
              "agent-system/orchestration/supervisor.mjs",
              "agent-system/registries/HERMES_COMMANDER_AUTOMATION_REGISTRY.json",
              "agent-system/registries/SHARED_PROJECT_MEMORY_FABRIC.json",
              "deploy/oracle/hermes-codex/hermes-hooks/dial-post-turn-checkpoint.sh",
              "deploy/oracle/hermes-codex/hermes-hooks/dial-pre-turn-context.sh",
              "deploy/oracle/hermes-codex/install-control-plane.sh",
              "deploy/oracle/hermes-codex/install-shared-project-memory-fabric.sh",
              "deploy/oracle/hermes-codex/install-trading-memory-peer.sh",
              "deploy/oracle/hermes-codex/systemd/dial-review-coordinator.service",
              "docs/orchestration/DIAL_SHARED_PROJECT_MEMORY_REVIEW_FABRIC.md",
              "docs/project-state/authorizations/auth-20260921-owner-spmrf-final-integration.json",
              "tests/orchestration-shared-project-memory.test.mjs",
              "vitest.config.ts"
            ],
            "change_classes": [
              "shared_project_memory",
              "cross_harness_context_cache",
              "delta_handover",
              "checkpoint_review_mesh",
              "token_efficiency",
              "multi_account_chatgpt_continuity",
              "canonical_branch_integration"
            ],
            "owner_overrides": [],
            "material_scope_expansion": true,
            "security_authority_change": false,
            "owner_control_boundary_change": false,
            "reusable": false,
            "revoked": false
          }
          JSON

          python3 - "$REG" <<'PY'
          import json, sys
          p=sys.argv[1]
          with open(p, encoding='utf-8') as f:
              obj=json.load(f)
          obj['canonical_integration']={
              'repository_target':'master',
              'integration_branch':'gpt/hermes-full-commander-chatgpt-control-20260921-clean',
              'authorization_id':'auth-20260921-owner-spmrf-final-integration'
          }
          with open(p,'w',encoding='utf-8') as f:
              json.dump(obj,f,indent=2)
              f.write('\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$AUTH" "$REG"
          python3 scripts/project_truth_local.py record
          git diff --cached --check
          git commit -m "chore(governance): authorize SPMRF final DIAL integration"
          python3 scripts/project_truth_local.py verify
          git push origin HEAD:gpt/hermes-full-commander-chatgpt-control-20260921-clean

      - name: Receipt
        run: |
          echo "Final integration authorization committed and Project Truth verified." >> "$GITHUB_STEP_SUMMARY"
