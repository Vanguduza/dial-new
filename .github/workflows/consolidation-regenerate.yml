name: Consolidation generated-state refresh
on:
  push:
    branches:
      - gpt/dial-all-work-consolidation-20260922

permissions:
  contents: write

concurrency:
  group: dial-consolidation-generated-state
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt/dial-all-work-consolidation-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate deterministic Development Unit registry
        run: node agent-system/orchestration/development-unit-planner.mjs write
      - name: Commit generated state with Project Truth evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- agent-system/registries/DEVELOPMENT_UNIT_REGISTRY.json; then
            echo "Development Unit registry already current."
            exit 0
          fi
          git add agent-system/registries/DEVELOPMENT_UNIT_REGISTRY.json
          python3 scripts/project_truth_local.py record
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(consolidation): regenerate Development Unit registry"
          git push origin HEAD:gpt/dial-all-work-consolidation-20260922
