name: Project Truth Authority
on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-truth-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  project-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Validate owner-authority policy
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          manifest=json.loads(pathlib.Path('PROJECT_CANONICAL_STATE.json').read_text())
          policy=json.loads(pathlib.Path('docs/project-state/OWNER_AUTHORITY_POLICY.json').read_text())
          if manifest.get('repository')!=os.environ['GITHUB_REPOSITORY']: sys.exit('BLOCKED: manifest repository mismatch')
          mp=manifest.get('policy',{})
          if not mp.get('owner_instruction_is_project_truth_authority'): sys.exit('BLOCKED: owner authority policy missing')
          if not policy.get('rules',{}).get('agent_self_authorization_forbidden'): sys.exit('BLOCKED: agent self-authorization guard missing')
          if not policy.get('rules',{}).get('default_branch_post_merge_is_read_only'): sys.exit('BLOCKED: protected-master read-only rule missing')
          PY
      - name: Verify authorized PR-native Project Truth
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/project_truth_local.py verify-pr \
            --base "${{ github.event.pull_request.base.sha }}" \
            --branch "${{ github.head_ref }}"
      - name: Verify protected default branch without mutation
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          python3 scripts/project_truth_local.py verify-merge \
            --before "${{ github.event.before }}" \
            --after "${{ github.sha }}"
      - name: Block unresolved release tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json,sys
          if json.load(open('PROJECT_CANONICAL_STATE.json')).get('canonical_state',{}).get('release_blocked',True):
              sys.exit('BLOCKED: unresolved canonical state')
          PY
