# OCI handoff retry 1
# OIDC diagnostics retry v3
name: Dial Control GitHub OIDC admin
# oidc-diagnostic-trigger-3

on:
  push:
    branches:
      - gpt/netcup-hermes-control-integrated-20260921
    paths:
      - .github/workflows/netcup-admin-oidc.yml
  workflow_dispatch:
    inputs:
      operation:
        description: Bounded Dial Control admin operation
        required: true
        default: prepare_oci_recovery
        type: choice
        options:
          - prepare_oci_recovery
          - configure_and_discover_oci
          - custom
      command:
        description: Custom root command. Used only when operation=custom. Never place secrets here.
        required: false
        type: string
      oci_user_ocid:
        description: Dedicated OCI recovery user OCID. Used only by configure_and_discover_oci.
        required: false
        type: string
      oci_tenancy_ocid:
        description: OCI tenancy OCID. Used only by configure_and_discover_oci.
        required: false
        type: string
      oci_region:
        description: OCI recovery region
        required: false
        default: af-johannesburg-1
        type: string
      acknowledge_root:
        description: Type I_UNDERSTAND_ROOT
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dial-control-oci-key-handoff-v3
  cancel-in-progress: true

env:
  DIAL_CONTROL_OIDC_URL: http://62.83.35.103:9134/v1/action

jobs:
  admin:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Vanguduza/dial-new' && github.actor == 'Vanguduza' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Diagnose GitHub OIDC claims and controller refusal
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BODY='{"action":"status"}'
          HASH="$(printf '%s' "$BODY" | sha256sum | awk '{print $1}')"
          AUDIENCE="dial-control:$HASH"
          ENCODED_AUDIENCE="$(jq -nr --arg v "$AUDIENCE" '$v|@uri')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && SEP='&'
          TOKEN="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}" | jq -er '.value')"
          PAYLOAD="$(cut -d. -f2 <<<"$TOKEN" | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print}' | base64 -d 2>/dev/null)"
          echo "$PAYLOAD" | jq '{actor,repository,ref,workflow_ref,event_name,job_workflow_ref,run_id,run_attempt}'
          TMP="$RUNNER_TEMP/controller-response.json"
          CODE="$(curl -sS -o "$TMP" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary "$BODY" "$DIAL_CONTROL_OIDC_URL")"
          echo "CONTROLLER_HTTP=$CODE"
          jq -c '{ok,error,result:(if (.result|type)=="object" then {ok:.result.ok,status:.result.status,signal:.result.signal,error:.result.error} else .result end)}' "$TMP" 2>/dev/null || { echo "CONTROLLER_BODY_NON_JSON"; head -c 800 "$TMP"; echo; }
          [[ "$CODE" =~ ^2[0-9][0-9]$ ]] || exit 7

      - name: Refresh bounded Dial Control runtime helpers
        if: ${{ inputs.operation == 'prepare_oci_recovery' || inputs.operation == 'configure_and_discover_oci' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          admin_exec() {
            local raw="$1" b64 body response
            [[ ${#raw} -le 32768 ]] || { echo "::error::bounded admin command too large"; exit 5; }
            b64="$(printf '%s' "$raw" | base64 -w0)"
            body="$(jq -cn --arg c "$b64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
            response="$(bash deploy/netcup/hermes-control/github-oidc-call.sh "$body")"
            jq -e '.ok == true' <<<"$response" >/dev/null
          }
          push_file() {
            local src="$1" dst="$2" mode="$3" checker="$4"
            local name tmp data sha chunk
            name="$(basename "$dst")"
            tmp="/tmp/dial-runtime-refresh-$name.b64"
            data="$(base64 -w0 "$src")"
            sha="$(sha256sum "$src" | awk '{print $1}')"
            admin_exec "set -Eeuo pipefail; rm -f '$tmp'; : >'$tmp'; chmod 600 '$tmp'"
            while [[ -n "$data" ]]; do
              chunk="${data:0:10000}"
              data="${data:10000}"
              admin_exec "set -Eeuo pipefail; printf '%s' '$chunk' >>'$tmp'"
            done
            admin_exec "set -Eeuo pipefail; install -d -m 0755 /usr/local/lib/dial-control; base64 -d '$tmp' >'$dst.tmp'; echo '$sha  $dst.tmp' | sha256sum -c -; $checker '$dst.tmp'; install -m '$mode' '$dst.tmp' '$dst'; rm -f '$dst.tmp' '$tmp'"
          }

          push_file deploy/netcup/hermes-control/github-oidc-control.mjs /usr/local/lib/dial-control/github-oidc-control.mjs 0755 "/home/ubuntu/.local/bin/node --check"
          push_file deploy/netcup/hermes-control/prepare-oci-recovery.sh /usr/local/lib/dial-control/prepare-oci-recovery.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/oci-enroll-oracle-estate.sh /usr/local/lib/dial-control/oci-enroll-oracle-estate.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/install-housekeeping-final-estate.sh /usr/local/lib/dial-control/install-housekeeping-final-estate.sh 0755 "bash -n"
          push_file deploy/oracle/resource-fabric/zero-touch-enroll-peer.sh /usr/local/lib/dial-control/zero-touch-enroll-peer.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/configure-wireguard-fabric.sh /usr/local/lib/dial-control/configure-wireguard-fabric.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/rotate-bootstrap-identities.sh /usr/local/lib/dial-control/rotate-bootstrap-identities.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/retire-oracle-a1-control-role.sh /usr/local/lib/dial-control/retire-oracle-a1-control-role.sh 0755 "bash -n"

          admin_exec "set -Eeuo pipefail; systemd-run --unit=dial-github-oidc-refresh --on-active=2s /bin/systemctl restart dial-github-oidc-control.service >/dev/null; echo DIAL_CONTROL_RUNTIME_REFRESH=SCHEDULED"
          ok=false
          for attempt in $(seq 1 18); do
            sleep 5
            if response="$(bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"status"}' 2>/dev/null)" &&
               jq -e '.ok == true and (.result | has("oci_estate_inventory")) and (.result | has("oci_peers_enrolled")) and (.result | has("housekeeping_estate"))' <<<"$response" >/dev/null 2>&1; then
              ok=true
              break
            fi
          done
          [[ "$ok" == true ]] || { echo "::error::Refreshed controller contract did not come back"; exit 6; }
          echo DIAL_CONTROL_RUNTIME_REFRESH=GREEN

      - name: Validate explicit root acknowledgement
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.acknowledge_root }}" == "I_UNDERSTAND_ROOT" ]] || {
            echo "::error::Root acknowledgement is required."
            exit 2
          }

      - name: Build bounded admin command
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CUSTOM_COMMAND: ${{ inputs.command }}
          OCI_USER_OCID: ${{ inputs.oci_user_ocid }}
          OCI_TENANCY_OCID: ${{ inputs.oci_tenancy_ocid }}
          OCI_REGION: ${{ inputs.oci_region }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/admin-command.txt"
          case "$OPERATION" in
            prepare_oci_recovery)
              cat >"$OUT" <<EOF
          set -Eeuo pipefail
          REF='__DIAL_EDGE_BOOTSTRAP_REF__'
          TMP="\$(mktemp /tmp/owner-oci-handoff.XXXXXX.sh)"
          trap 'rm -f "\$TMP"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/Vanguduza/dial-new/\$REF/deploy/netcup/hermes-control/owner-oci-handoff.sh" \
            -o "\$TMP"
          bash -n "\$TMP"
          bash "\$TMP" prepare "\$REF"
          EOF
              ;;
            configure_and_discover_oci)
              [[ "$OCI_USER_OCID" == ocid1.user.* ]] || { echo "::error::Valid oci_user_ocid required"; exit 3; }
              [[ "$OCI_TENANCY_OCID" == ocid1.tenancy.* ]] || { echo "::error::Valid oci_tenancy_ocid required"; exit 3; }
              [[ "$OCI_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo "::error::Valid OCI region required"; exit 3; }
              USER_Q="$(printf '%q' "$OCI_USER_OCID")"
              TENANCY_Q="$(printf '%q' "$OCI_TENANCY_OCID")"
              REGION_Q="$(printf '%q' "$OCI_REGION")"
              cat >"$OUT" <<EOF
          set -Eeuo pipefail
          test -x /usr/local/lib/dial-control/owner-oci-handoff.sh
          /usr/local/lib/dial-control/owner-oci-handoff.sh configure-and-discover $USER_Q $TENANCY_Q $REGION_Q
          EOF
              ;;
            custom)
              [[ -n "$CUSTOM_COMMAND" ]] || { echo "::error::Custom command is empty"; exit 3; }
              printf '%s' "$CUSTOM_COMMAND" >"$OUT"
              ;;
            *) echo "::error::Unsupported operation: $OPERATION"; exit 3 ;;
          esac
          [[ -s "$OUT" ]] || { echo "::error::Admin command was not built"; exit 3; }
          [[ "$(wc -c <"$OUT")" -le 32768 ]] || { echo "::error::Admin command exceeds controller limit"; exit 3; }

      - name: Execute audited Dial Control command
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_COMMAND="$(cat "$RUNNER_TEMP/admin-command.txt")"
          RAW_COMMAND="$(printf '%s' "$RAW_COMMAND" | sed "s/__DIAL_EDGE_BOOTSTRAP_REF__/$GITHUB_SHA/g")"
          COMMAND_B64="$(printf '%s' "$RAW_COMMAND" | base64 -w0)"
          BODY="$(jq -cn --arg c "$COMMAND_B64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
          RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh "$BODY")"
          jq -e '.ok == true' <<<"$RESPONSE" >/dev/null
          {
            echo "## Dial Control GitHub OIDC admin receipt"
            echo "- operation: `${{ inputs.operation }}`"
            echo "- actor: $GITHUB_ACTOR"
            echo "- run: $GITHUB_RUN_ID"
            echo "- command SHA-256: $(jq -r '.result.command_sha256' <<<"$RESPONSE")"
            echo "- exit status: $(jq -r '.result.status' <<<"$RESPONSE")"
            echo ""
            echo '### stdout'
            echo '~~~text'
            jq -r '.result.stdout' <<<"$RESPONSE"
            echo '~~~'
            echo ""
            echo '### stderr'
            echo '~~~text'
            jq -r '.result.stderr' <<<"$RESPONSE"
            echo '~~~'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Prepare OCI recovery identity for browser handoff
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_COMMAND="$(cat <<'CMD'
          set -Eeuo pipefail
          test -x /usr/local/lib/dial-control/owner-oci-handoff.sh
          /usr/local/lib/dial-control/owner-oci-handoff.sh prepare '$GITHUB_SHA'
          CMD
          )"
          COMMAND_B64="$(printf '%s' "$RAW_COMMAND" | base64 -w0)"
          BODY="$(jq -cn --arg c "$COMMAND_B64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
          RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh "$BODY")"
          jq -e '.ok == true' <<<"$RESPONSE" >/dev/null
          jq -r '.result.stdout' <<<"$RESPONSE"
          {
            echo "## OCI recovery browser handoff"
            echo '~~~text'
            jq -r '.result.stdout' <<<"$RESPONSE"
            echo '~~~'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Verify local OCI recovery authority
        if: ${{ inputs.operation == 'configure_and_discover_oci' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"status"}')"
          jq -e '.ok == true and .result.recovery_ready == true' <<<"$RESPONSE" >/dev/null
          echo OCI_RECOVERY_LOCAL_AUTHORITY=GREEN

  edge-bootstrap:
    if: ${{ github.event_name == 'push' && github.repository == 'Vanguduza/dial-new' && github.actor == 'Vanguduza' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare dedicated OCI recovery key on Dial Control
        shell: bash
        run: |
          set -Eeuo pipefail
          RAW_COMMAND="$(cat <<'CMD'
          set -Eeuo pipefail
          OCI_DIR=/home/ubuntu/.oci
          KEY="$OCI_DIR/netcup-hermes-recovery.pem"
          PUB="$OCI_DIR/netcup-hermes-recovery_public.pem"
          CONFIG="$OCI_DIR/config"
          ESTATE=/etc/dial/oracle-estate.env
          install -d -m 0700 -o ubuntu -g ubuntu "$OCI_DIR"
          if [[ ! -s "$KEY" ]]; then
            openssl genrsa -out "$KEY" 2048 >/dev/null 2>&1
          fi
          if [[ ! -s "$PUB" ]]; then
            openssl rsa -pubout -in "$KEY" -out "$PUB" >/dev/null 2>&1
          fi
          FP="$(openssl rsa -pubout -outform DER -in "$KEY" 2>/dev/null | openssl md5 -c | awk '{print $2}')"
          cat >"$CONFIG" <<EOF
[DEFAULT]
user=REPLACE_WITH_DEDICATED_OCI_USER_OCID
fingerprint=$FP
tenancy=REPLACE_WITH_TENANCY_OCID
region=af-johannesburg-1
key_file=$KEY
EOF
          chown ubuntu:ubuntu "$KEY" "$PUB" "$CONFIG"
          chmod 0600 "$KEY" "$CONFIG"
          chmod 0644 "$PUB"
          install -d -m 0755 /etc/dial
          if [[ ! -f "$ESTATE" ]]; then
            cat >"$ESTATE" <<'EOF'
# Non-secret OCI instance inventory used by Netcup recovery/GitHub admin.
# A1 is one physical transition peer; there is intentionally no fourth old-control OCID.
DIAL_OCI_COMPARTMENT=
VAN_TRADING_CORE_OCID=
VEKL_WORKER_OCID=
ORACLE_ADMIN_OCID=
EOF
          fi
          chmod 0600 "$ESTATE"
          echo OCI_RECOVERY_IDENTITY=PREPARED
          echo public_key_begin
          cat "$PUB"
          echo public_key_end
          echo "fingerprint=$FP"
          echo OCI_RECOVERY_CONFIG=OWNER_ACTION_REQUIRED
          CMD
          )"
          COMMAND_B64="$(printf '%s' "$RAW_COMMAND" | base64 -w0)"
          BODY="$(jq -cn --arg c "$COMMAND_B64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
          RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh "$BODY")"
          jq -e '.ok == true' <<<"$RESPONSE" >/dev/null
          OUT="$(jq -r '.result.stdout' <<<"$RESPONSE")"
          printf '%s\n' "$OUT"
          grep -q '^OCI_RECOVERY_IDENTITY=PREPARED$' <<<"$OUT"
          grep -q '^public_key_begin$' <<<"$OUT"
          grep -q '^public_key_end$' <<<"$OUT"
          grep -q '^fingerprint=' <<<"$OUT"
          {
            echo '## OCI recovery public-key handoff'
            echo 'Upload only this public key to the dedicated OCI recovery user. The private key remains on Dial Control.'
            echo '~~~text'
            awk '/^public_key_begin$/{flag=1;next}/^public_key_end$/{flag=0}flag' <<<"$OUT"
            grep '^fingerprint=' <<<"$OUT"
            echo '~~~'
          } >>"$GITHUB_STEP_SUMMARY"
