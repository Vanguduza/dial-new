name: Dial Control GitHub OIDC admin

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bounded Dial Control admin operation
        required: true
        default: prepare_oci_recovery
        type: choice
        options:
          - prepare_oci_recovery
          - configure_and_discover_oci
          - start_oci_edge_login
          - oci_edge_login_status
          - finish_oci_edge_login
          - abort_oci_edge_login
          - rediscover_oci_estate
          - enable_oci_run_command
          - rebuild_oci_instance
          - grant_ocarun_sudo
          - custom
      command:
        description: Custom root command. Used only when operation=custom. Never place secrets here.
        required: false
        type: string
      oci_user_ocid:
        description: Dedicated OCI recovery user OCID. Used only by configure_and_discover_oci.
        required: false
        type: string
      oci_tenancy_ocid:
        description: OCI tenancy OCID. Required by configure_and_discover_oci and finish_oci_edge_login (the login must belong to it).
        required: false
        type: string
      oci_a1_instance_ocid:
        description: Optional. The authoritative van-trading-core instance when finish_oci_edge_login lists more than one CANDIDATE.
        required: false
        type: string
      oci_recovery_user_email:
        description: Primary email for the dedicated dial-netcup-recovery OCI user (required by identity domains). Used only by finish_oci_edge_login.
        required: false
        type: string
      oci_rebuild_host:
        description: Host for rebuild_oci_instance (terminate preserving boot volume, relaunch with ocarun sudo). Owner decision auth-20260923-owner-estate-rebuild-hermes-becomes-van.
        required: false
        type: choice
        default: none
        options:
          - none
          - oracle-admin
          - vekl-worker
      oci_region:
        description: OCI recovery region
        required: false
        default: af-johannesburg-1
        type: string
      acknowledge_root:
        description: Type I_UNDERSTAND_ROOT
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dial-control-oidc-admin
  cancel-in-progress: false

env:
  DIAL_CONTROL_OIDC_URL: http://62.83.35.103:9134/v1/action

jobs:
  admin:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Vanguduza/dial-new' && github.actor == 'Vanguduza' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Refresh bounded Dial Control runtime helpers
        if: ${{ inputs.operation != 'custom' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          admin_exec() {
            local raw="$1" b64 body response
            [[ ${#raw} -le 32768 ]] || { echo "::error::bounded admin command too large"; exit 5; }
            b64="$(printf '%s' "$raw" | base64 -w0)"
            body="$(jq -cn --arg c "$b64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
            response="$(bash deploy/netcup/hermes-control/github-oidc-call.sh "$body")"
            jq -e '.ok == true' <<<"$response" >/dev/null
          }
          push_file() {
            local src="$1" dst="$2" mode="$3" checker="$4"
            local name tmp data sha chunk stage
            name="$(basename "$dst")"
            # Keep the real extension last: node --check rejects "x.mjs.tmp" (ERR_UNKNOWN_FILE_EXTENSION).
            stage="${dst%.*}.tmp.${dst##*.}"
            tmp="/tmp/dial-runtime-refresh-$name.b64"
            data="$(base64 -w0 "$src")"
            sha="$(sha256sum "$src" | awk '{print $1}')"
            admin_exec "set -Eeuo pipefail; rm -f '$tmp'; : >'$tmp'; chmod 600 '$tmp'"
            while [[ -n "$data" ]]; do
              chunk="${data:0:10000}"
              data="${data:10000}"
              admin_exec "set -Eeuo pipefail; printf '%s' '$chunk' >>'$tmp'"
            done
            admin_exec "set -Eeuo pipefail; install -d -m 0755 /usr/local/lib/dial-control; base64 -d '$tmp' >'$stage'; echo '$sha  $stage' | sha256sum -c -; $checker '$stage'; install -m '$mode' '$stage' '$dst'; rm -f '$stage' '$tmp'"
          }

          push_file deploy/netcup/hermes-control/github-oidc-control.mjs /usr/local/lib/dial-control/github-oidc-control.mjs 0755 "/home/ubuntu/.local/bin/node --check"
          push_file deploy/netcup/hermes-control/prepare-oci-recovery.sh /usr/local/lib/dial-control/prepare-oci-recovery.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/oci-edge-login.sh /usr/local/lib/dial-control/oci-edge-login.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/oci-edge-capture.py /usr/local/lib/dial-control/oci-edge-capture.py 0755 "python3 -m py_compile"
          push_file deploy/netcup/hermes-control/oci-enroll-oracle-estate.sh /usr/local/lib/dial-control/oci-enroll-oracle-estate.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/install-housekeeping-final-estate.sh /usr/local/lib/dial-control/install-housekeeping-final-estate.sh 0755 "bash -n"
          push_file deploy/oracle/resource-fabric/zero-touch-enroll-peer.sh /usr/local/lib/dial-control/zero-touch-enroll-peer.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/configure-wireguard-fabric.sh /usr/local/lib/dial-control/configure-wireguard-fabric.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/rotate-bootstrap-identities.sh /usr/local/lib/dial-control/rotate-bootstrap-identities.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/retire-oracle-a1-control-role.sh /usr/local/lib/dial-control/retire-oracle-a1-control-role.sh 0755 "bash -n"
          push_file deploy/netcup/hermes-control/grant-ocarun-sudo.sh /usr/local/lib/dial-control/grant-ocarun-sudo.sh 0755 "bash -n"

          admin_exec "set -Eeuo pipefail; systemd-run --unit=dial-github-oidc-refresh --on-active=2s /bin/systemctl restart dial-github-oidc-control.service >/dev/null; echo DIAL_CONTROL_RUNTIME_REFRESH=SCHEDULED"
          ok=false
          for attempt in $(seq 1 18); do
            sleep 5
            if response="$(bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"status"}' 2>/dev/null)" &&
               jq -e '.ok == true and (.result | has("oci_estate_inventory")) and (.result | has("oci_peers_enrolled")) and (.result | has("housekeeping_estate"))' <<<"$response" >/dev/null 2>&1; then
              ok=true
              break
            fi
          done
          [[ "$ok" == true ]] || { echo "::error::Refreshed controller contract did not come back"; exit 6; }
          echo DIAL_CONTROL_RUNTIME_REFRESH=GREEN

      - name: Validate explicit root acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.acknowledge_root }}" == "I_UNDERSTAND_ROOT" ]] || {
            echo "::error::Root acknowledgement is required."
            exit 2
          }

      - name: Build bounded admin command
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CUSTOM_COMMAND: ${{ inputs.command }}
          OCI_USER_OCID: ${{ inputs.oci_user_ocid }}
          OCI_TENANCY_OCID: ${{ inputs.oci_tenancy_ocid }}
          OCI_REGION: ${{ inputs.oci_region }}
          OCI_A1_OCID: ${{ inputs.oci_a1_instance_ocid }}
          OCI_USER_EMAIL: ${{ inputs.oci_recovery_user_email }}
          OCI_REBUILD_HOST: ${{ inputs.oci_rebuild_host }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/admin-command.txt"
          case "$OPERATION" in
            prepare_oci_recovery)
              cat >"$OUT" <<EOF
          set -Eeuo pipefail
          REF='$GITHUB_SHA'
          TMP="\$(mktemp /tmp/owner-oci-handoff.XXXXXX.sh)"
          trap 'rm -f "\$TMP"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/Vanguduza/dial-new/\$REF/deploy/netcup/hermes-control/owner-oci-handoff.sh" \
            -o "\$TMP"
          bash -n "\$TMP"
          bash "\$TMP" prepare "\$REF"
          EOF
              ;;
            configure_and_discover_oci)
              [[ "$OCI_USER_OCID" == ocid1.user.* ]] || { echo "::error::Valid oci_user_ocid required"; exit 3; }
              [[ "$OCI_TENANCY_OCID" == ocid1.tenancy.* ]] || { echo "::error::Valid oci_tenancy_ocid required"; exit 3; }
              [[ "$OCI_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo "::error::Valid OCI region required"; exit 3; }
              USER_Q="$(printf '%q' "$OCI_USER_OCID")"
              TENANCY_Q="$(printf '%q' "$OCI_TENANCY_OCID")"
              REGION_Q="$(printf '%q' "$OCI_REGION")"
              cat >"$OUT" <<EOF
          set -Eeuo pipefail
          test -x /usr/local/lib/dial-control/owner-oci-handoff.sh
          /usr/local/lib/dial-control/owner-oci-handoff.sh configure-and-discover $USER_Q $TENANCY_Q $REGION_Q
          EOF
              ;;
            start_oci_edge_login|oci_edge_login_status|finish_oci_edge_login|abort_oci_edge_login|rediscover_oci_estate|enable_oci_run_command|rebuild_oci_instance)
              [[ "$OCI_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo "::error::Valid OCI region required"; exit 3; }
              REGION_Q="$(printf '%q' "$OCI_REGION")"
              case "$OPERATION" in
                start_oci_edge_login)  ARGS="start $REGION_Q" ;;
                oci_edge_login_status) ARGS="status" ;;
                abort_oci_edge_login)  ARGS="abort" ;;
                enable_oci_run_command)
                  [[ "$OCI_TENANCY_OCID" =~ ^ocid1\.tenancy\.[a-z0-9-]+\.[a-z0-9-]*\.[a-z0-9]+$ ]] || { echo "::error::Valid oci_tenancy_ocid required"; exit 3; }
                  ARGS="enable-run-command $(printf '%q' "$OCI_TENANCY_OCID")" ;;
                rebuild_oci_instance)
                  [[ "$OCI_TENANCY_OCID" =~ ^ocid1\.tenancy\.[a-z0-9-]+\.[a-z0-9-]*\.[a-z0-9]+$ ]] || { echo "::error::Valid oci_tenancy_ocid required"; exit 3; }
                  [[ "$OCI_REBUILD_HOST" == oracle-admin || "$OCI_REBUILD_HOST" == vekl-worker ]] || { echo "::error::oci_rebuild_host must be oracle-admin or vekl-worker"; exit 3; }
                  ARGS="rebuild-instance $(printf '%q' "$OCI_TENANCY_OCID") $OCI_REBUILD_HOST" ;;
                rediscover_oci_estate)
                  [[ -z "$OCI_A1_OCID" || "$OCI_A1_OCID" =~ ^ocid1\.instance\.[a-z0-9-]+\.[a-z0-9-]*\.[a-z0-9]+$ ]] || { echo "::error::Invalid oci_a1_instance_ocid"; exit 3; }
                  ARGS="rediscover $(printf '%q' "${OCI_A1_OCID:-}")" ;;
                finish_oci_edge_login)
                  [[ "$OCI_TENANCY_OCID" =~ ^ocid1\.tenancy\.[a-z0-9-]+\.[a-z0-9-]*\.[a-z0-9]+$ ]] || { echo "::error::Valid oci_tenancy_ocid required: the login is refused unless it belongs to this tenancy"; exit 3; }
                  ARGS="finish $(printf '%q' "$OCI_TENANCY_OCID") $REGION_Q"
                  if [[ -n "$OCI_A1_OCID" ]]; then
                    [[ "$OCI_A1_OCID" =~ ^ocid1\.instance\.[a-z0-9-]+\.[a-z0-9-]*\.[a-z0-9]+$ ]] || { echo "::error::Invalid oci_a1_instance_ocid"; exit 3; }
                  fi
                  if [[ -n "$OCI_USER_EMAIL" ]]; then
                    [[ "$OCI_USER_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::error::Invalid oci_recovery_user_email"; exit 3; }
                  fi
                  # Positional: [van-trading-core-ocid] [recovery-user-email]; '' keeps the slot.
                  ARGS="$ARGS $(printf '%q' "${OCI_A1_OCID:-}") $(printf '%q' "${OCI_USER_EMAIL:-}")" ;;
              esac
              cat >"$OUT" <<EOF
          set -Eeuo pipefail
          test -x /usr/local/lib/dial-control/oci-edge-login.sh
          /usr/local/lib/dial-control/oci-edge-login.sh $ARGS
          EOF
              ;;
            grant_ocarun_sudo)
              cat >"$OUT" <<'EOF'
          set -Eeuo pipefail
          test -x /usr/local/lib/dial-control/grant-ocarun-sudo.sh
          /usr/local/lib/dial-control/grant-ocarun-sudo.sh
          EOF
              ;;
            custom)
              [[ -n "$CUSTOM_COMMAND" ]] || { echo "::error::Custom command is empty"; exit 3; }
              printf '%s' "$CUSTOM_COMMAND" >"$OUT"
              ;;
            *) echo "::error::Unsupported operation: $OPERATION"; exit 3 ;;
          esac
          [[ -s "$OUT" ]] || { echo "::error::Admin command was not built"; exit 3; }
          [[ "$(wc -c <"$OUT")" -le 32768 ]] || { echo "::error::Admin command exceeds controller limit"; exit 3; }

      - name: Execute audited Dial Control command
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          RAW_COMMAND="$(cat "$RUNNER_TEMP/admin-command.txt")"
          COMMAND_B64="$(printf '%s' "$RAW_COMMAND" | base64 -w0)"
          BODY="$(jq -cn --arg c "$COMMAND_B64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
          RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh "$BODY")"
          jq -e '.ok == true' <<<"$RESPONSE" >/dev/null
          # The OCI login operations print only OCIDs, states and login/callback URLs, never tokens or keys.
          if [[ "$OPERATION" == *oci_edge_login* || "$OPERATION" == rediscover_oci_estate || "$OPERATION" == enable_oci_run_command || "$OPERATION" == rebuild_oci_instance || "$OPERATION" == grant_ocarun_sudo ]]; then jq -r '.result.stdout' <<<"$RESPONSE"; fi
          {
            echo "## Dial Control GitHub OIDC admin receipt"
            echo "- operation: \`$OPERATION\`"
            echo "- actor: $GITHUB_ACTOR"
            echo "- run: $GITHUB_RUN_ID"
            echo "- command SHA-256: $(jq -r '.result.command_sha256' <<<"$RESPONSE")"
            echo "- exit status: $(jq -r '.result.status' <<<"$RESPONSE")"
            echo ""
            echo '### stdout'
            echo '~~~text'
            jq -r '.result.stdout' <<<"$RESPONSE"
            echo '~~~'
            echo ""
            echo '### stderr'
            echo '~~~text'
            jq -r '.result.stderr' <<<"$RESPONSE"
            echo '~~~'
            if [[ "$OPERATION" == start_oci_edge_login ]]; then
              echo ""
              echo "### Next"
              echo "1. Open OCI_EDGE_SIGNIN_PAGE. Tap 'Sign in to OCI' and sign in to the tenancy you will name in finish_oci_edge_login."
              echo "2. The browser then fails to open http://localhost:8181/#... — copy that whole address and paste it into the sign-in page. It says 'Captured' only once Dial Control has saved the session."
              echo "3. Run finish_oci_edge_login with oci_tenancy_ocid. A login to any other tenancy is refused and destroyed."
              echo ""
              echo "This page is public: it shows the login URL and callback host, never the token."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Verify local OCI recovery authority
        if: ${{ inputs.operation == 'configure_and_discover_oci' || inputs.operation == 'finish_oci_edge_login' || inputs.operation == 'rediscover_oci_estate' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"status"}')"
          jq -e '.ok == true and .result.recovery_ready == true' <<<"$RESPONSE" >/dev/null
          echo OCI_RECOVERY_LOCAL_AUTHORITY=GREEN
