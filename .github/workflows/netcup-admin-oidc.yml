name: Dial Control GitHub OIDC admin

on:
  push:
    branches:
      - gpt/netcup-hermes-control-integrated-20260921
    paths:
      - .github/workflows/netcup-admin-oidc.yml
  workflow_dispatch:
    inputs:
      command:
        description: Root command to execute on Dial Control. Do not place secrets here.
        required: true
        type: string
      acknowledge_root:
        description: Type I_UNDERSTAND_ROOT
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dial-control-oidc-admin
  cancel-in-progress: false

env:
  DIAL_CONTROL_OIDC_URL: http://62.83.35.103:9134/v1/action

jobs:
  admin:
    if: ${{ github.repository == 'Vanguduza/dial-new' && github.actor == 'Vanguduza' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate explicit root acknowledgement
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.acknowledge_root }}" == "I_UNDERSTAND_ROOT" ]] || {
            echo "::error::Root acknowledgement is required."
            exit 2
          }

      - name: Execute audited Dial Control command
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RAW_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          [[ -n "$RAW_COMMAND" ]] || { echo "::error::Command is empty"; exit 2; }
          [[ ${#RAW_COMMAND} -le 32768 ]] || { echo "::error::Command is too long"; exit 2; }
          COMMAND_B64="$(printf '%s' "$RAW_COMMAND" | base64 -w0)"
          BODY="$(jq -cn --arg c "$COMMAND_B64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
          RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh "$BODY")"
          jq -e '.ok == true' <<<"$RESPONSE" >/dev/null
          {
            echo "## Dial Control GitHub OIDC admin receipt"
            echo "- actor: $GITHUB_ACTOR"
            echo "- run: $GITHUB_RUN_ID"
            echo "- command SHA-256: $(jq -r '.result.command_sha256' <<<"$RESPONSE")"
            echo "- exit status: $(jq -r '.result.status' <<<"$RESPONSE")"
            echo ""
            echo '### stdout'
            echo '~~~text'
            jq -r '.result.stdout' <<<"$RESPONSE"
            echo '~~~'
            echo ""
            echo '### stderr'
            echo '~~~text'
            jq -r '.result.stderr' <<<"$RESPONSE"
            echo '~~~'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Prepare dedicated OCI recovery identity on Dial Control
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT_B64="$(base64 -w0 deploy/netcup/hermes-control/prepare-oci-recovery.sh)"
          RAW_COMMAND="set -Eeuo pipefail; install -d -m 0755 /usr/local/lib/dial-control; printf '%s' '$SCRIPT_B64' | base64 -d >/usr/local/lib/dial-control/prepare-oci-recovery.sh; chmod 0755 /usr/local/lib/dial-control/prepare-oci-recovery.sh; bash -n /usr/local/lib/dial-control/prepare-oci-recovery.sh; /usr/sbin/runuser -u ubuntu -- env HOME=/home/ubuntu PATH=/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin bash /usr/local/lib/dial-control/prepare-oci-recovery.sh prepare"
          COMMAND_B64="$(printf '%s' "$RAW_COMMAND" | base64 -w0)"
          BODY="$(jq -cn --arg c "$COMMAND_B64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
          HASH="$(printf '%s' "$BODY" | sha256sum | awk '{print $1}')"
          AUDIENCE="dial-control:$HASH"
          ENCODED_AUDIENCE="$(jq -nr --arg v "$AUDIENCE" '$v|@uri')"
          SEP='?'; [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && SEP='&'
          TOKEN="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${SEP}audience=${ENCODED_AUDIENCE}" | jq -er '.value')"
          HTTP="$(curl -sS -o "$RUNNER_TEMP/admin-response.json" -w '%{http_code}' --connect-timeout 10 --max-time 1800 -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary "$BODY" "$DIAL_CONTROL_OIDC_URL")"
          echo "controller_http=$HTTP"
          jq . "$RUNNER_TEMP/admin-response.json" || cat "$RUNNER_TEMP/admin-response.json"
          [[ "$HTTP" == 200 ]]
          jq -e '.ok == true and (.result.stdout | contains("OCI_RECOVERY_IDENTITY=PREPARED"))' "$RUNNER_TEMP/admin-response.json" >/dev/null
          jq -r '.result.stdout' "$RUNNER_TEMP/admin-response.json"
