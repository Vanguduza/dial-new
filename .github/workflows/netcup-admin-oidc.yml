name: Install VAN Rive build system on Dial Control

on:
  push:
    branches:
      - gpt/netcup-hermes-control-integrated-20260921
    paths:
      - .github/workflows/netcup-admin-oidc.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: dial-control-rive-install
  cancel-in-progress: false

env:
  DIAL_CONTROL_OIDC_URL: http://62.83.35.103:9134/v1/action
  VAN_SHA: 1a2ab7c7f6c59e1164a7f4e12a7ea262dbeaa54e

jobs:
  install:
    if: ${{ github.repository == 'Vanguduza/dial-new' && github.actor == 'Vanguduza' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install and qualify Character Forge Rive workstation
        shell: bash
        run: |
          set -Eeuo pipefail

          oidc_admin() {
            local raw="$1"
            local command_b64 body hash audience encoded sep token
            command_b64="$(printf '%s' "$raw" | base64 -w0)"
            body="$(jq -cn --arg c "$command_b64" '{action:"admin-command",ack:"I_UNDERSTAND_ROOT",command_b64:$c}')"
            hash="$(printf '%s' "$body" | sha256sum | awk '{print $1}')"
            audience="dial-control:$hash"
            encoded="$(jq -nr --arg v "$audience" '$v|@uri')"
            sep='?'
            [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *\?* ]] && sep='&'
            token="$(
              curl --proto '=https' --tlsv1.2 -fsS \
                -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=${encoded}" |
                jq -er '.value'
            )"
            curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 1190 \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              --data-binary "$body" \
              "$DIAL_CONTROL_OIDC_URL"
          }

          START_COMMAND="$(cat <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname -s)" = dial-control
          UNIT=van-character-forge-bootstrap-__RUN_ID__
          WORK=/var/lib/dial-control/van-character-forge-bootstrap-source
          rm -rf "$WORK"
          git clone --filter=blob:none https://github.com/Vanguduza/Van.git "$WORK"
          git -C "$WORK" fetch --depth=1 origin __VAN_SHA__
          git -C "$WORK" checkout --detach __VAN_SHA__
          systemd-run \
            --unit="$UNIT" \
            --property=TimeoutStartSec=infinity \
            --setenv=VAN_COMMIT_SHA=__VAN_SHA__ \
            --setenv=CHARACTER_FORGE_COMMANDER_USER=ubuntu \
            /bin/bash "$WORK/deploy/character-forge/bootstrap-netcup-authoring.sh"
          printf 'UNIT=%s\nWORK=%s\n' "$UNIT" "$WORK"
          REMOTE
          )"
          START_COMMAND="${START_COMMAND//__RUN_ID__/$GITHUB_RUN_ID}"
          START_COMMAND="${START_COMMAND//__VAN_SHA__/$VAN_SHA}"
          START_RESPONSE="$(oidc_admin "$START_COMMAND")"
          jq -e '.ok == true and .result.status == 0' <<<"$START_RESPONSE" >/dev/null

          UNIT="van-character-forge-bootstrap-$GITHUB_RUN_ID"
          state=unknown
          result=unknown
          exec_status=255

          for attempt in $(seq 1 240); do
            POLL_COMMAND="set -Eeuo pipefail; unit='$UNIT'; if systemctl show \"\$unit\" >/dev/null 2>&1; then load=\$(systemctl show -p LoadState --value \"\$unit\"); active=\$(systemctl show -p ActiveState --value \"\$unit\"); sub=\$(systemctl show -p SubState --value \"\$unit\"); result=\$(systemctl show -p Result --value \"\$unit\"); status=\$(systemctl show -p ExecMainStatus --value \"\$unit\"); else load=not-found; active=unknown; sub=unknown; result=unknown; status=255; fi; printf 'LOAD_STATE=%s\\nACTIVE_STATE=%s\\nSUB_STATE=%s\\nRESULT=%s\\nEXEC_STATUS=%s\\n' \"\$load\" \"\$active\" \"\$sub\" \"\$result\" \"\$status\""
            POLL_RESPONSE="$(oidc_admin "$POLL_COMMAND")"
            jq -e '.ok == true and .result.status == 0' <<<"$POLL_RESPONSE" >/dev/null
            stdout="$(jq -r '.result.stdout' <<<"$POLL_RESPONSE")"
            state="$(awk -F= '$1=="ACTIVE_STATE"{print $2}' <<<"$stdout")"
            result="$(awk -F= '$1=="RESULT"{print $2}' <<<"$stdout")"
            exec_status="$(awk -F= '$1=="EXEC_STATUS"{print $2}' <<<"$stdout")"
            echo "bootstrap attempt $attempt: active=$state result=$result exec=$exec_status"
            if [[ "$state" == inactive && "$result" == success && "$exec_status" == 0 ]]; then
              break
            fi
            if [[ "$state" == failed || ( "$state" == inactive && "$result" != success ) ]]; then
              LOG_RESPONSE="$(oidc_admin "journalctl -u '$UNIT' -n 250 --no-pager; exit 0")"
              jq -r '.result.stdout,.result.stderr' <<<"$LOG_RESPONSE" >&2
              exit 1
            fi
            sleep 30
          done

          [[ "$state" == inactive && "$result" == success && "$exec_status" == 0 ]] || {
            echo "::error::Character Forge bootstrap did not complete successfully"
            exit 1
          }

          FINAL_COMMAND="$(cat <<'REMOTE'
          set -Eeuo pipefail
          test "$(hostname -s)" = dial-control
          test -x /usr/local/bin/rive
          printf 'HOST=%s\n' "$(hostname -s)"
          printf 'RIVE_VERSION=%s\n' "$(rive --version 2>&1 | head -n1)"
          printf '%s\n' '=== QUALIFICATION ==='
          sudo -n -u vanforge /usr/local/libexec/van-character-forge-worker qualify
          printf '%s\n' '=== TOOLCHAIN_LOCK ==='
          cat /var/lib/dial-character-forge/toolchain.lock.json
          printf '%s\n' '=== CHARACTER_FORGE_STATUS ==='
          sudo -n -u vanforge /usr/local/libexec/van-character-forge-worker status
          REMOTE
          )"
          FINAL_RESPONSE="$(oidc_admin "$FINAL_COMMAND")"
          jq -e '.ok == true and .result.status == 0' <<<"$FINAL_RESPONSE" >/dev/null
          jq -r '.result.stdout' <<<"$FINAL_RESPONSE" | tee "$RUNNER_TEMP/van-rive-install-receipt.txt"
          jq -r '.result.stderr' <<<"$FINAL_RESPONSE" | tee -a "$RUNNER_TEMP/van-rive-install-receipt.txt" >&2

          {
            echo "## VAN Character Forge Rive workstation"
            echo "- target: dial-control"
            echo "- VAN SHA: $VAN_SHA"
            echo "- bootstrap: PASS"
            echo "- qualification: PASS"
            echo "- root command SHA-256: $(jq -r '.result.command_sha256' <<<"$FINAL_RESPONSE")"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload installation receipt
        uses: actions/upload-artifact@v4
        with:
          name: van-rive-netcup-install-receipt
          path: ${{ runner.temp }}/van-rive-install-receipt.txt
          if-no-files-found: error
          retention-days: 90
