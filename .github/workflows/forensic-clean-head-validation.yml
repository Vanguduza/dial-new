name: forensic-clean-head-validation
on:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/fable-forensic-predevelopment-standard-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: verify clean forensic head
        run: npm run verify
      - name: orchestration qualification
        run: npm run agent:orchestration:qualify
      - name: Project Truth direct verification
        run: python scripts/project_truth_local.py verify
