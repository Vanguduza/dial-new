name: Netcup recovery live observer

on:
  push:
    branches:
      - gpt/netcup-hermes-control-integrated-20260921
    paths:
      - .github/workflows/netcup-recovery-live-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: netcup-recovery-live-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Broadcast recovery progress
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_RUN_ID: '35816464668'
          EXPECTED_PAYLOAD_REF: '74c21a6bd3dee0807ac4002eb9b7971af4846ca3'
          CONTROL_IP: '62.83.35.103'
        run: |
          set -Eeuo pipefail

          broadcast() {
            local state="$1" description="$2" payload
            description="${description:0:135}"
            payload="$(jq -nc \
              --arg state "$state" \
              --arg context 'netcup-recovery/live' \
              --arg description "$description" \
              --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
            printf 'RECOVERY_OBSERVER state=%s description=%s\n' "$state" "$description"
          }

          for tick in $(seq 1 70); do
            run_json="$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN_ID")"
            run_status="$(jq -r '.status // "unknown"' <<<"$run_json")"
            run_conclusion="$(jq -r '.conclusion // "none"' <<<"$run_json")"

            ssh=false
            timeout 3 bash -c "</dev/tcp/$CONTROL_IP/22" >/dev/null 2>&1 && ssh=true || true

            health_json="$(curl -fsS --max-time 4 "http://$CONTROL_IP:9134/healthz" 2>/dev/null || echo '{}')"
            host="$(jq -r '.host // "null"' <<<"$health_json" 2>/dev/null || echo null)"
            phase="$(jq -r '.bootstrap_phase // "null"' <<<"$health_json" 2>/dev/null || echo null)"
            repo_head="$(jq -r '.repo_head // "null"' <<<"$health_json" 2>/dev/null || echo null)"
            health_ok=false
            if jq -e --arg expected "$EXPECTED_PAYLOAD_REF" '.ok == true and .host == "dial-control" and .bootstrap_phase == "CONTROL_PLANE_READY" and .repo_head == $expected' <<<"$health_json" >/dev/null 2>&1; then
              health_ok=true
            fi

            short_repo="${repo_head:0:12}"
            [[ -n "$short_repo" ]] || short_repo=null
            desc="run=$run_status ssh=$ssh health=$health_ok phase=$phase repo=$short_repo"
            broadcast pending "$desc"
            echo "OBSERVER tick=$tick/70 $desc host=$host conclusion=$run_conclusion"

            if [[ "$run_status" == completed ]]; then
              if [[ "$run_conclusion" == success && "$health_ok" == true ]]; then
                broadcast success "RECOVERY_GREEN ssh=$ssh health=$health_ok repo=$short_repo"
                exit 0
              fi
              broadcast failure "RECOVERY_DONE conclusion=$run_conclusion ssh=$ssh health=$health_ok repo=$short_repo"
              exit 1
            fi

            sleep 30
          done

          broadcast error "OBSERVER_TIMEOUT run still active after 35m"
          exit 2
