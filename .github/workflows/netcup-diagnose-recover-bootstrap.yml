name: Netcup diagnose and recover Dial Control

on:
  push:
    branches:
      - gpt/netcup-hermes-control-integrated-20260921
    paths:
      - .github/workflows/netcup-diagnose-recover-bootstrap.yml
      - deploy/netcup/hermes-control/netcup-custom-script.sh
      - deploy/netcup/hermes-control/image-bootstrap.sh
      - deploy/netcup/hermes-control/install-github-oidc-control.sh
      - deploy/netcup/hermes-control/github-oidc-control.mjs
  workflow_dispatch:
  # Validated manual recovery retrigger; push-path changes also invoke the same authority.

permissions:
  contents: read

concurrency:
  group: netcup-dial-control-scp-mutation
  cancel-in-progress: false

env:
  NETCUP_SCP_API_BASE_URL: https://www.servercontrolpanel.de/scp-core/api
  NETCUP_SCP_OIDC_BASE_URL: https://www.servercontrolpanel.de/realms/scp/protocol/openid-connect
  NETCUP_DIAL_CONTROL_IP: 62.83.35.103
  DIAL_BOOTSTRAP_REPAIR_REF: ${{ github.sha }}

jobs:
  request-authorization:
    runs-on: ubuntu-latest
    outputs:
      device_code: ${{ steps.device.outputs.device_code }}
      interval: ${{ steps.device.outputs.interval }}
    steps:
      - id: device
        name: Request Netcup SCP recovery authorization
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS --fail-with-body -X POST \
            "$NETCUP_SCP_OIDC_BASE_URL/auth/device" \
            -d "client_id=scp" \
            -d "scope=openid")"
          DEVICE_CODE="$(jq -r '.device_code' <<<"$RESPONSE")"
          USER_CODE="$(jq -r '.user_code' <<<"$RESPONSE")"
          VERIFY_URL="$(jq -r '.verification_uri_complete' <<<"$RESPONSE")"
          INTERVAL="$(jq -r '.interval // 5' <<<"$RESPONSE")"
          [[ -n "$DEVICE_CODE" && "$DEVICE_CODE" != null ]]
          [[ -n "$VERIFY_URL" && "$VERIFY_URL" != null ]]
          {
            echo "device_code=$DEVICE_CODE"
            echo "interval=$INTERVAL"
          } >>"$GITHUB_OUTPUT"
          printf 'NETCUP_RECOVERY_APPROVAL_URL=%s\n' "$VERIFY_URL"
          printf 'NETCUP_RECOVERY_USER_CODE=%s\n' "$USER_CODE"
          {
            echo "## Netcup recovery authorization required"
            echo ""
            echo "$VERIFY_URL"
            echo ""
            printf 'User code: %s\n' "$USER_CODE"
          } >>"$GITHUB_STEP_SUMMARY"

  diagnose-and-recover:
    needs: request-authorization
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Diagnose SCP state and recover bootstrap if required
        shell: bash
        env:
          DEVICE_CODE: ${{ needs.request-authorization.outputs.device_code }}
          DEVICE_INTERVAL: ${{ needs.request-authorization.outputs.interval }}
        run: |
          set -Eeuo pipefail
          shopt -s inherit_errexit

          interval="${DEVICE_INTERVAL:-5}"
          TOKEN=""
          for attempt in $(seq 1 120); do
            RESPONSE="$(curl -sS -X POST \
              "$NETCUP_SCP_OIDC_BASE_URL/token" \
              -d "grant_type=urn:ietf:params:oauth:grant-type:device_code" \
              -d "device_code=$DEVICE_CODE" \
              -d "client_id=scp" || true)"
            TOKEN="$(jq -r '.access_token // empty' <<<"$RESPONSE" 2>/dev/null || true)"
            [[ -n "$TOKEN" ]] && break
            ERROR="$(jq -r '.error // empty' <<<"$RESPONSE" 2>/dev/null || true)"
            case "$ERROR" in
              authorization_pending|"") ;;
              slow_down) interval=$((interval + 5)) ;;
              access_denied|expired_token)
                echo "::error::Netcup authorization failed: $ERROR"
                exit 20
                ;;
            esac
            sleep "$interval"
          done
          [[ -n "$TOKEN" ]] || { echo "::error::Netcup authorization timed out"; exit 20; }

          AUTH_STATE="$RUNNER_TEMP/netcup-scp-auth"
          install -d -m 0700 "$AUTH_STATE"

          persist_token_response() {
            local response="$1" access refresh expires
            access="$(jq -r '.access_token // empty' <<<"$response" 2>/dev/null || true)"
            refresh="$(jq -r '.refresh_token // empty' <<<"$response" 2>/dev/null || true)"
            expires="$(jq -r '.expires_in // 300' <<<"$response" 2>/dev/null || echo 300)"
            [[ -n "$access" ]] || return 1
            printf '%s' "$access" >"$AUTH_STATE/access_token"
            printf '%s\n' "$(( $(date +%s) + expires ))" >"$AUTH_STATE/expires_at"
            if [[ -n "$refresh" ]]; then
              printf '%s' "$refresh" >"$AUTH_STATE/refresh_token"
            fi
            chmod 0600 "$AUTH_STATE/access_token" "$AUTH_STATE/expires_at"
            [[ ! -e "$AUTH_STATE/refresh_token" ]] || chmod 0600 "$AUTH_STATE/refresh_token"
          }

          persist_token_response "$RESPONSE"

          access_token() {
            local now expires refresh response
            now="$(date +%s)"
            expires="$(cat "$AUTH_STATE/expires_at" 2>/dev/null || echo 0)"
            if (( now + 30 >= expires )); then
              refresh="$(cat "$AUTH_STATE/refresh_token" 2>/dev/null || true)"
              [[ -n "$refresh" ]] || {
                echo "::error::Netcup access token is expiring and no refresh token was issued" >&2
                return 1
              }
              response="$(curl -sS --fail-with-body -X POST \
                "$NETCUP_SCP_OIDC_BASE_URL/token" \
                -d "grant_type=refresh_token" \
                -d "refresh_token=$refresh" \
                -d "client_id=scp")" || return 1
              persist_token_response "$response" || return 1
              echo "Netcup SCP access token refreshed" >&2
            fi
            cat "$AUTH_STATE/access_token"
          }

          api_get() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $(access_token)" \
              -H "accept: application/json" "$1"
          }
          api_post() {
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $(access_token)" \
              -H "accept: application/json" "$1"
          }
          api_patch() {
            local url="$1" body="$2"
            curl -sS --fail-with-body -X PATCH \
              -H "Authorization: Bearer $(access_token)" \
              -H "Content-Type: application/merge-patch+json" \
              -H "accept: application/json" \
              --data "$body" "$url"
          }
          tcp_open() {
            timeout 3 bash -c "</dev/tcp/$NETCUP_DIAL_CONTROL_IP/$1" >/dev/null 2>&1
          }

          SERVERS="$(curl -sS --fail-with-body -G \
            -H "Authorization: Bearer $(access_token)" \
            -H "accept: application/json" \
            --data-urlencode "ip=$NETCUP_DIAL_CONTROL_IP" \
            "$NETCUP_SCP_API_BASE_URL/v1/servers")"
          SERVER_ID="$(jq -r 'if length == 1 then .[0].id else empty end' <<<"$SERVERS")"
          [[ "$SERVER_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not resolve exactly one server for $NETCUP_DIAL_CONTROL_IP"
            jq '[.[] | {id,name,hostname,serverLiveInfo}]' <<<"$SERVERS"
            exit 21
          }
          echo "NETCUP_SERVER_ID=$SERVER_ID"

          SERVER="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID")"
          INTERFACES="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/interfaces")"
          GUEST_STATUS="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/guest-agent/status" || echo '{}')"
          GUEST_DATA="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/guest-agent" || echo '{}')"
          RESCUE="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/rescuesystem" || echo '{}')"
          LOGS="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/logs?limit=50&offset=0" || echo '[]')"
          CPU="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/metrics/cpu?hours=1" || echo '{}')"
          NET="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/metrics/network?hours=1" || echo '{}')"

          echo "=== SCP SERVER ==="
          jq '{id,name,hostname,disabled,rescueSystemActive,serverLiveInfo,ipv4Addresses,ipv6Addresses,architecture}' <<<"$SERVER"
          echo "=== SCP INTERFACES ==="
          jq '.' <<<"$INTERFACES"
          echo "=== GUEST AGENT STATUS ==="
          jq '.' <<<"$GUEST_STATUS"
          echo "=== GUEST AGENT DATA (summary) ==="
          jq '{guestAgentAvailable,keys:(.guestAgentData // {} | keys)}' <<<"$GUEST_DATA" 2>/dev/null || true
          echo "=== RESCUE STATUS (password redacted) ==="
          jq 'del(.password)' <<<"$RESCUE"
          echo "=== RECENT SCP LOGS ==="
          jq '[.[] | {date,type,logKey,message}]' <<<"$LOGS"
          echo "=== CPU METRICS ==="
          jq '.' <<<"$CPU"
          echo "=== NETWORK METRICS ==="
          jq '.' <<<"$NET"

          FIREWALL_BLOCKING=false
          while IFS= read -r mac; do
            [[ -n "$mac" ]] || continue
            FW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/interfaces/$mac/firewall?consistencyCheck=true" || echo '{}')"
            echo "=== FIREWALL $mac ==="
            jq '.' <<<"$FW"
            active="$(jq -r '.active // false' <<<"$FW")"
            ingress="$(jq -r '.ingressImplicitRule // empty' <<<"$FW")"
            if [[ "$active" == true && "$ingress" == DROP_ALL ]]; then
              FIREWALL_BLOCKING=true
              echo "::warning::Active Netcup firewall with DROP_ALL ingress detected on $mac"
            fi
          done < <(jq -r '.[].mac // empty' <<<"$INTERFACES")

          state="$(jq -r '.serverLiveInfo.state // empty' <<<"$SERVER")"
          uptime="$(jq -r '.serverLiveInfo.uptimeInSeconds // 0' <<<"$SERVER")"
          guest_available="$(jq -r '.available // false' <<<"$GUEST_STATUS")"
          ssh=false; oidc=false
          tcp_open 22 && ssh=true || true
          tcp_open 9134 && oidc=true || true
          echo "DIAG state=$state uptime=$uptime guest_agent=$guest_available ssh=$ssh oidc=$oidc firewall_drop=$FIREWALL_BLOCKING"

          if [[ "$oidc" == true ]]; then
            echo "DIAL_CONTROL_RECOVERY=NOT_REQUIRED_OIDC_ALREADY_UP"
            exit 0
          fi

          # The VM is a fresh bootstrap target and migration has not begun. If
          # normal boot is alive but inaccessible, use Netcup rescue to repair
          # the installed filesystem deterministically.
          echo "DIAL_CONTROL_RECOVERY=RESCUE_REQUIRED"

          api_patch() {
            local url="$1" body="$2"
            curl -sS --fail-with-body -X PATCH \
              -H "Authorization: Bearer $(access_token)" \
              -H "Content-Type: application/merge-patch+json" \
              -H "accept: application/json" \
              --data "$body" "$url"
          }

          wait_state() {
            local wanted="$1"
            for attempt in $(seq 1 90); do
              SERVER_NOW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" || echo '{}')"
              state_now="$(jq -r '.serverLiveInfo.state // empty' <<<"$SERVER_NOW")"
              echo "server_state=$state_now wanted=$wanted"
              [[ "$state_now" == "$wanted" ]] && return 0
              sleep 5
            done
            return 1
          }

          RESCUE="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/rescuesystem" || echo '{}')"
          rescue_active="$(jq -r '.active // false' <<<"$RESCUE")"
          rescue_was_active="$rescue_active"
          activated_rescue_now=false
          echo "initial_rescue_active=$rescue_active initial_state=$state"

          if [[ "$rescue_active" != true ]]; then
            if [[ "$state" == "RUNNING" ]]; then
              echo "Stopping normal Ubuntu before rescue activation..."
              api_patch "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" '{"state":"OFF"}' >/tmp/stop-task.json || \
                api_patch "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID?stateOption=POWEROFF" '{"state":"OFF"}' >/tmp/stop-task.json
              wait_state SHUTOFF || { echo "::error::Server did not reach SHUTOFF"; exit 29; }
            fi

            echo "Activating Netcup rescue system on stopped VM..."
            set +e
            RESCUE_HTTP="$(curl -sS -o /tmp/rescue-activate.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $(access_token)" \
              -H "Content-Type: application/json" \
              -H "accept: application/json" \
              "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/rescuesystem")"
            rc=$?
            set -e
            echo "rescue_activate_http=$RESCUE_HTTP curl_rc=$rc"
            cat /tmp/rescue-activate.json 2>/dev/null || true
            [[ "$rc" -eq 0 && "$RESCUE_HTTP" =~ ^20[0-9]$ ]] || {
              echo "::error::Rescue activation failed"
              exit 30
            }
            activated_rescue_now=true
          else
            echo "Netcup rescue is already active; preserving existing rescue state."
          fi

          RESCUE_PASSWORD=""
          for attempt in $(seq 1 60); do
            RESCUE="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/rescuesystem" || echo '{}')"
            active="$(jq -r '.active // false' <<<"$RESCUE")"
            RESCUE_PASSWORD="$(jq -r '.password // empty' <<<"$RESCUE")"
            [[ "$active" == true && -n "$RESCUE_PASSWORD" ]] && break
            sleep 5
          done
          [[ -n "$RESCUE_PASSWORD" ]] || { echo "::error::Rescue password was not issued"; exit 31; }

          SERVER_NOW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" || echo '{}')"
          state_now="$(jq -r '.serverLiveInfo.state // empty' <<<"$SERVER_NOW")"
          if [[ "$rescue_was_active" == true && "$activated_rescue_now" == false && "$state_now" == "SHUTOFF" ]]; then
            echo "Starting pre-existing stopped rescue system..."
            api_patch "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" '{"state":"ON"}' >/tmp/rescue-start.json
          elif [[ "$activated_rescue_now" == true ]]; then
            echo "New rescue activation owns its own start transition; waiting without issuing a second start."
          fi

          echo "Waiting for rescue SSH..."
          for attempt in $(seq 1 120); do
            RESCUE_NOW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/rescuesystem" || echo '{}')"
            SERVER_NOW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" || echo '{}')"
            rescue_now="$(jq -r '.active // false' <<<"$RESCUE_NOW")"
            state_now="$(jq -r '.serverLiveInfo.state // empty' <<<"$SERVER_NOW")"
            echo "rescue_active=$rescue_now server_state=$state_now"
            if [[ "$rescue_now" == true ]] && [[ "$state_now" == "RUNNING" ]] && tcp_open 22; then
              break
            fi
            sleep 5
          done
          RESCUE_NOW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/rescuesystem" || echo '{}')"
          [[ "$(jq -r '.active // false' <<<"$RESCUE_NOW")" == true ]] || {
            echo "::error::Rescue system is not active"
            exit 32
          }
          tcp_open 22 || { echo "::error::SSH did not open in rescue"; exit 33; }

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          export SSHPASS="$RESCUE_PASSWORD"
          SSH=(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 root@"$NETCUP_DIAL_CONTROL_IP")
          SCP=(sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)

          echo "=== RESCUE BLOCK DEVICES ==="
          "${SSH[@]}" 'lsblk -o NAME,PATH,SIZE,FSTYPE,TYPE,MOUNTPOINTS'

          ROOTDEV="$("${SSH[@]}" 'set -Eeuo pipefail
            if mountpoint -q /mnt/dial-root && grep -q "^ID=ubuntu" /mnt/dial-root/etc/os-release 2>/dev/null; then
              findmnt -n -o SOURCE --target /mnt/dial-root
              exit 0
            fi

            mkdir -p /mnt/dial-probe
            for dev in $(lsblk -rpno NAME,FSTYPE | awk '"'"'$2 ~ /^(ext4|xfs|btrfs)$/ {print $1}'"'"'); do
              existing="$(findmnt -rn -S "$dev" -o TARGET 2>/dev/null | head -1 || true)"
              if [[ -n "$existing" ]] && grep -q "^ID=ubuntu" "$existing/etc/os-release" 2>/dev/null; then
                printf "%s" "$dev"
                exit 0
              fi
              umount /mnt/dial-probe >/dev/null 2>&1 || true
              if mount -o ro "$dev" /mnt/dial-probe >/dev/null 2>&1; then
                if grep -q "^ID=ubuntu" /mnt/dial-probe/etc/os-release 2>/dev/null; then
                  printf "%s" "$dev"
                  umount /mnt/dial-probe
                  exit 0
                fi
                umount /mnt/dial-probe
              fi
            done
            exit 1
          ')"
          [[ -n "$ROOTDEV" ]] || { echo "::error::Could not identify Ubuntu root filesystem"; exit 33; }
          echo "UBUNTU_ROOT_DEVICE=$ROOTDEV"

          "${SSH[@]}" "set -Eeuo pipefail
            mkdir -p /mnt/dial-root
            umount /mnt/dial-root >/dev/null 2>&1 || true
            mount '$ROOTDEV' /mnt/dial-root
            if [[ -f /mnt/dial-root/etc/environment ]]; then
              sed -i 's|^DIAL_CONTROL_DISPLAY_NAME=.*$|DIAL_CONTROL_DISPLAY_NAME=\"Dial Control\"|' /mnt/dial-root/etc/environment
            fi
            if [[ -f /mnt/dial-root/home/ubuntu/.config/environment.d/10-dial-host.conf ]]; then
              sed -i 's|^DIAL_CONTROL_DISPLAY_NAME=.*$|DIAL_CONTROL_DISPLAY_NAME=\"Dial Control\"|' /mnt/dial-root/home/ubuntu/.config/environment.d/10-dial-host.conf
            fi
            echo '=== INSTALLED BOOTSTRAP ARTIFACTS BEFORE REPAIR ==='
            ls -l /mnt/dial-root/etc/systemd/system/dial-control-bootstrap.service 2>/dev/null || true
            ls -l /mnt/dial-root/etc/systemd/system/multi-user.target.wants/dial-control-bootstrap.service 2>/dev/null || true
            ls -l /mnt/dial-root/usr/local/sbin/dial-control-bootstrap-runner 2>/dev/null || true
            cat /mnt/dial-root/root/dial-control-bootstrap-scheduled 2>/dev/null || true
            tail -n 250 /mnt/dial-root/var/log/dial-control-bootstrap.log 2>/dev/null || true
            cat /mnt/dial-root/var/lib/dial-control/bootstrap/image-bootstrap.receipt 2>/dev/null || true
            echo '=== BOOT-CRITICAL CONFIG ==='
            cat /mnt/dial-root/etc/fstab 2>/dev/null || true
            cat /mnt/dial-root/etc/netplan/*.yaml 2>/dev/null || true
            grep '^DIAL_' /mnt/dial-root/etc/environment 2>/dev/null || true
            ls -l /mnt/dial-root/etc/systemd/system/multi-user.target.wants/ssh.service 2>/dev/null || true
            cat /mnt/dial-root/var/lib/dial-control/bootstrap/boot-sentinel.txt 2>/dev/null || true
            cat /mnt/dial-root/var/lib/dial-control/bootstrap/failure-snapshot.txt 2>/dev/null || true
            cat /mnt/dial-root/var/lib/dial-control/bootstrap/runner-diagnostics.txt 2>/dev/null || true
            cat /mnt/dial-root/var/lib/dial-control/bootstrap/stage 2>/dev/null || true
          "

          curl -sS --fail --location \
            "https://raw.githubusercontent.com/Vanguduza/dial-new/$DIAL_BOOTSTRAP_REPAIR_REF/deploy/netcup/hermes-control/netcup-custom-script.sh" \
            -o /tmp/netcup-custom-script.sh
          chmod 0700 /tmp/netcup-custom-script.sh
          "${SCP[@]}" /tmp/netcup-custom-script.sh root@"$NETCUP_DIAL_CONTROL_IP":/tmp/netcup-custom-script.sh >/dev/null

          cat >"$RUNNER_TEMP/dial-root-verify.sh" <<'VERIFY_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          ROOTDEV="$1"
          mountpoint -q /mnt/dial-root || mount "$ROOTDEV" /mnt/dial-root
          cp /tmp/netcup-custom-script.sh /mnt/dial-root/tmp/netcup-custom-script.sh
          chmod 0700 /mnt/dial-root/tmp/netcup-custom-script.sh
          chroot /mnt/dial-root /bin/bash /tmp/netcup-custom-script.sh
          
          test -s /mnt/dial-root/etc/systemd/system/dial-control-bootstrap.service
          test -L /mnt/dial-root/etc/systemd/system/multi-user.target.wants/dial-control-bootstrap.service
          test -L /mnt/dial-root/etc/systemd/system/multi-user.target.wants/dial-control-boot-sentinel.service
          test -x /mnt/dial-root/usr/local/sbin/dial-control-bootstrap-runner
          test -x /mnt/dial-root/usr/local/sbin/dial-control-boot-sentinel
          test -x /mnt/dial-root/usr/local/sbin/dial-control-bootstrap-failure-snapshot
          
          SERVICE_REF="$(sed -n 's/^Environment=DIAL_BOOTSTRAP_REF=//p' /mnt/dial-root/etc/systemd/system/dial-control-bootstrap.service)"
          SCHEDULED_REF="$(sed -n 's/^DIAL_BOOTSTRAP_REF=//p' /mnt/dial-root/root/dial-control-bootstrap-scheduled)"
          SERVICE_BLOB="$(sed -n 's/^Environment=EXPECTED_IMAGE_BLOB=//p' /mnt/dial-root/etc/systemd/system/dial-control-bootstrap.service)"
          SCHEDULED_BLOB="$(sed -n 's/^IMAGE_BOOTSTRAP_BLOB=//p' /mnt/dial-root/root/dial-control-bootstrap-scheduled)"
          [[ "$SERVICE_REF" =~ ^[0-9a-f]{40}$ && "$SERVICE_REF" == "$SCHEDULED_REF" ]]
          [[ "$SERVICE_BLOB" =~ ^[0-9a-f]{40}$ && "$SERVICE_BLOB" == "$SCHEDULED_BLOB" ]]
          echo "effective_bootstrap_ref=$SERVICE_REF"
          echo "effective_image_blob=$SERVICE_BLOB"
          
          chroot /mnt/dial-root /bin/bash -n /usr/local/sbin/dial-control-bootstrap-runner
          chroot /mnt/dial-root /bin/sh -c '. /etc/environment'
          install -d -m 2755 /mnt/dial-root/var/log/journal 2>/dev/null || true
          systemctl --root=/mnt/dial-root enable ssh.service >/dev/null
          chroot /mnt/dial-root ssh-keygen -A
          install -d -m 0755 /mnt/dial-root/run/sshd
          chroot /mnt/dial-root /usr/sbin/sshd -t
          chroot /mnt/dial-root netplan generate
          findmnt --verify --verbose --tab-file /mnt/dial-root/etc/fstab
          systemd-analyze verify --root=/mnt/dial-root /etc/systemd/system/dial-control-bootstrap.service >/tmp/systemd-verify.txt 2>&1 || {
            cat /tmp/systemd-verify.txt
            echo "::error::Offline systemd bootstrap verification failed"
            exit 37
          }
          sync
          umount /mnt/dial-root
                    VERIFY_EOF
          chmod 0700 "$RUNNER_TEMP/dial-root-verify.sh"
          "${SCP[@]}" "$RUNNER_TEMP/dial-root-verify.sh" root@"$NETCUP_DIAL_CONTROL_IP":/tmp/dial-root-verify.sh >/dev/null
          "${SSH[@]}" "bash /tmp/dial-root-verify.sh '$ROOTDEV'"
          echo "INSTALLED_FILESYSTEM_BOOTSTRAP_REPAIR=GREEN"

          echo "Stopping rescue boot..."
          api_patch "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" '{"state":"OFF"}' >/tmp/rescue-stop.json || \
            api_patch "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID?stateOption=POWEROFF" '{"state":"OFF"}' >/tmp/rescue-stop.json
          wait_state SHUTOFF || { echo "::error::Rescue VM did not stop"; exit 34; }

          echo "Deactivating rescue system..."
          curl -sS --fail-with-body -X DELETE \
            -H "Authorization: Bearer $(access_token)" \
            -H "accept: application/json" \
            "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/rescuesystem" >/tmp/rescue-off.json

          for attempt in $(seq 1 60); do
            RESCUE="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/rescuesystem" || echo '{}')"
            [[ "$(jq -r '.active // false' <<<"$RESCUE")" == false ]] && break
            sleep 3
          done
          [[ "$(jq -r '.active // false' <<<"$RESCUE")" == false ]] || {
            echo "::error::Rescue system did not deactivate"
            exit 35
          }

          echo "Starting repaired Ubuntu..."
          normal_start_ok=false
          for attempt in $(seq 1 60); do
            set +e
            NORMAL_HTTP="$(curl -sS -o /tmp/normal-start.json -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $(access_token)" \
              -H "Content-Type: application/merge-patch+json" \
              -H "accept: application/json" \
              --data '{"state":"ON"}' \
              "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID")"
            rc=$?
            set -e
            echo "normal_start_http=$NORMAL_HTTP curl_rc=$rc attempt=$attempt"
            if [[ "$rc" -eq 0 && "$NORMAL_HTTP" =~ ^20[0-9]$ ]]; then
              normal_start_ok=true
              break
            fi
            if [[ "$NORMAL_HTTP" == "409" ]]; then
              echo "Netcup is still finalizing rescue deactivation; retrying normal boot..."
              sleep 5
              continue
            fi
            cat /tmp/normal-start.json 2>/dev/null || true
            break
          done
          [[ "$normal_start_ok" == true ]] || {
            cat /tmp/normal-start.json 2>/dev/null || true
            echo "::error::Could not start repaired Ubuntu after rescue deactivation"
            exit 36
          }

          boot_reached=false
          for attempt in $(seq 1 60); do
            SERVER_NOW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" || echo '{}')"
            GUEST_NOW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/guest-agent/status" || echo '{}')"
            state_now="$(jq -r '.serverLiveInfo.state // empty' <<<"$SERVER_NOW")"
            guest_now="$(jq -r '.available // false' <<<"$GUEST_NOW")"
            ssh_now=false; oidc_now=false
            tcp_open 22 && ssh_now=true || true
            tcp_open 9134 && oidc_now=true || true
            if [[ "$oidc_now" == true ]]; then
              echo "DIAL_CONTROL_OIDC_LISTENER=UP_AFTER_REPAIR"
              exit 0
            fi
            if [[ "$state_now" == RUNNING && ( "$guest_now" == true || "$ssh_now" == true ) ]]; then
              boot_reached=true
              echo "NORMAL_BOOT_REACHED state=$state_now guest_agent=$guest_now ssh=$ssh_now"
              break
            fi
            if [[ "$state_now" == CRASHED || "$state_now" == SHUTOFF ]]; then
              echo "::error::Normal Ubuntu entered terminal state $state_now"
              break
            fi
            if (( attempt % 6 == 0 )); then
              echo "NORMAL_BOOT_WAIT attempt=$attempt/60 state=$state_now guest_agent=$guest_now ssh=$ssh_now oidc=$oidc_now"
            fi
            sleep 5
          done

          if [[ "$boot_reached" != true ]]; then
            echo "=== POST-BOOT SCP STATE ==="
            api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" | jq '{serverLiveInfo,rescueSystemActive}' || true
            api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/guest-agent/status" | jq '.' || true
            api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/logs?limit=50&offset=0" | jq '[.[] | {date,type,logKey,message}]' || true
            echo "::error::NORMAL_BOOT_UNREACHABLE: no guest agent or SSH within 5 minutes"
            exit 40
          fi

          for attempt in $(seq 1 180); do
            if tcp_open 9134; then
              echo "DIAL_CONTROL_OIDC_LISTENER=UP_AFTER_REPAIR"
              exit 0
            fi
            SERVER_NOW="$(api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" || echo '{}')"
            state_now="$(jq -r '.serverLiveInfo.state // empty' <<<"$SERVER_NOW")"
            ssh_now=false; tcp_open 22 && ssh_now=true || true
            if [[ "$state_now" == CRASHED || "$state_now" == SHUTOFF ]]; then
              echo "::error::Normal Ubuntu left RUNNING state while bootstrap was converging: $state_now"
              exit 41
            fi
            if (( attempt == 30 )) && [[ "$ssh_now" != true ]]; then
              echo "::error::SSH_RECOVERY_CHANNEL_UNREACHABLE: guest booted but SSH stayed closed for 5 minutes"
              exit 43
            fi
            if (( attempt % 6 == 0 )); then
              echo "OIDC_WAIT attempt=$attempt/180 state=$state_now ssh=$ssh_now"
            fi
            sleep 10
          done

          echo "=== OIDC TIMEOUT SCP STATE ==="
          api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID" | jq '{serverLiveInfo,rescueSystemActive}' || true
          api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/guest-agent/status" | jq '.' || true
          api_get "$NETCUP_SCP_API_BASE_URL/v1/servers/$SERVER_ID/logs?limit=50&offset=0" | jq '[.[] | {date,type,logKey,message}]' || true
          echo "::error::OIDC_BOOTSTRAP_TIMEOUT: host booted but listener did not appear within 30 minutes"
          exit 42
