name: verify

# Why this exists
#
# RBC-009 requires one pilot Feature proven to DOMAIN_TESTED. A gate proved once
# on one machine is not evidence — it cannot be re-derived, which is the same
# failure as treating a planning document as implemented code. This workflow is
# where DIAL's evidence is produced, because it is the only environment that can
# actually produce it:
#
#   * `npm ci` installs Linux-native binaries, so `sharp` and the DVTG pipeline
#     run. A Windows-installed node_modules cannot execute them.
#   * The preview player runs inside Cloudflare workerd via
#     @cloudflare/vite-plugin and needs network to Cloudflare. Restricted
#     environments refuse that, so the Playwright suite cannot start there.
#   * Rendered pack bytes vary with the encoder build. One environment is what
#     makes packs byte-comparable across the catalogue.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: gates, types and unit suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The whole chain: typecheck, schema, manifest, drift, gate ladder,
      # closure, realization, security, contract specificity, unit tests.
      # Any one of them failing fails the build — none may be skipped.
      - name: npm run verify
        run: npm run verify

      # Orchestration infrastructure is intentionally outside the product Feature
      # source map, so qualify its deterministic primitives explicitly as a CI gate.
      - name: orchestration control-plane primitives
        run: npm run agent:orchestration:qualify

      - name: orchestration JavaScript parses
        run: find agent-system/orchestration -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Oracle orchestration shell parses
        run: bash -n deploy/oracle/hermes-codex/*.sh deploy/oracle/hermes-codex/hermes-hooks/*.sh

      - name: corrective diff has no whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      # The manifest declares every pack file by hash. If regenerating it
      # produces a different file, someone changed pack content without
      # regenerating — the v2.1 overlay defect, which dropped 181 files while
      # every count still looked plausible.
      # --check compares the declared content only. A plain git diff after
      # regenerating can never be clean, because generated_at is a wall-clock
      # stamp that changes on every run regardless of pack content.
      - name: manifest is current
        run: node agent-system/bin/manifest-write.mjs --check

      # The scorecard is the project's own answer to "is this ready". It carried
      # hand-written counts and still said 186 features after twenty were added.
      - name: readiness scorecard is current
        run: node agent-system/bin/scorecard-refresh.mjs --check

  pack:
    name: pipeline produces a conforming pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Regenerate from source and re-validate. This is what proves the pack is
      # a function of its inputs rather than of whatever was last committed.
      - name: generate and validate the pilot pack
        run: |
          rm -rf artifacts/VF-TOYOTA-HILUX-AN130-DC-FL
          npm run generate:hilux
          npm run schema:check

      # QA evidence is frozen before the gate decides, so it exists on failures
      # too — which is precisely when it is worth keeping.
      - name: upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-qa-evidence
          path: |
            artifacts/**/qa/qa.json
            artifacts/**/navigation/hero-to-epc-flow-pack.json
            artifacts/**/exploded/explosion-plan.json
          if-no-files-found: warn

  e2e:
    name: customer transition contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The preview player must be installed from its OWN lockfile.
      # apps/preview-player pins vite 8.2.2, but the root tree resolves vite
      # 7.3.6 (vitest depends on it) and hoists @cloudflare/vite-plugin beside
      # it. The plugin then binds to Vite 7 while vinext runs the dev server on
      # Vite 8, and workerd dies with `Missing field 'moduleType'` before the
      # server binds - which is why config.webServer could not start. Installing
      # here gives the app a self-consistent tree.
      - name: install preview player
        working-directory: apps/preview-player
        run: npm ci --workspaces=false

      - name: install browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the preview server itself and waits for it.
      # All three projects run: desktop, mobile (§5.1 forgiving hit regions) and
      # reduced-motion (§4.3 cuts to the settled result).
      - name: npx playwright test
        run: npx playwright test

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
