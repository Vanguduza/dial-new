name: One-time PR40 Project Truth consolidation

on:
  push:
    branches:
      - 'gpt/shared-project-memory-review-fabric-20260921'

permissions:
  contents: write

concurrency:
  group: one-time-pr40-project-truth-consolidation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add append-only consolidation authority and record Project Truth
        shell: bash
        env:
          TARGET: gpt/hermes-full-commander-chatgpt-control-20260921-clean
        run: |
          set -euo pipefail
          git fetch origin "$TARGET"
          git checkout -B "$TARGET" "origin/$TARGET"

          python3 - <<'PY'
          import hashlib,json,pathlib
          excerpt=("Finish repository work by consolidating the owner-authorized shared project memory, "
                   "cross-harness review and Commander architecture into the canonical DIAL PR.")
          auth_id="auth-20260921-owner-spmrf-pr40-consolidation"
          paths=[
            "agent-system/orchestration/checkpoint-store.mjs",
            "agent-system/orchestration/commander-automation-client.mjs",
            "agent-system/orchestration/handoff-builder.mjs",
            "agent-system/orchestration/hermes-runtime-executor.mjs",
            "agent-system/orchestration/project-context-cache.mjs",
            "agent-system/orchestration/project-repository-resolver.mjs",
            "agent-system/orchestration/read-only-review-runner.mjs",
            "agent-system/orchestration/repository-understanding-snapshot.mjs",
            "agent-system/orchestration/review-coordinator.mjs",
            "agent-system/orchestration/review-fabric.mjs",
            "agent-system/orchestration/shared-context-resolver.mjs",
            "agent-system/orchestration/shared-memory-mcp.mjs",
            "agent-system/orchestration/shared-project-memory.mjs",
            "agent-system/orchestration/state-store.mjs",
            "agent-system/orchestration/supervisor.mjs",
            "agent-system/registries/HERMES_COMMANDER_AUTOMATION_REGISTRY.json",
            "agent-system/registries/SHARED_PROJECT_MEMORY_FABRIC.json",
            "deploy/oracle/hermes-codex/**",
            "docs/orchestration/**",
            "tests/orchestration-shared-project-memory.test.mjs",
            "vitest.config.ts"
          ]
          obj={
            "schema_version":1,
            "authorization_id":auth_id,
            "project":"dial",
            "authority":"OWNER_EXPLICIT",
            "owner_instruction_sha256":hashlib.sha256(excerpt.encode()).hexdigest(),
            "owner_instruction_excerpt":excerpt,
            "source":{
              "kind":"owner_session_instruction",
              "channel":"chatgpt",
              "request_id":"chatgpt-20260921-finish-repository-work",
              "owner_attested":True
            },
            "issued_at_utc":"2026-09-21T06:03:00Z",
            "base_sha":"1405daaa4b21b9ae35374282b191475e5bcc3ff6",
            "branch_scope":"gpt/hermes-full-commander-chatgpt-control-20260921-clean",
            "authorized_paths":paths,
            "change_classes":[
              "shared_project_memory",
              "cross_harness_review",
              "delta_handover",
              "repository_closure"
            ],
            "owner_overrides":[],
            "material_scope_expansion":True,
            "security_authority_change":False,
            "owner_control_boundary_change":False,
            "reusable":False,
            "revoked":False
          }
          out=pathlib.Path("docs/project-state/authorizations")/(auth_id+".json")
          if not out.exists():
            out.write_text(json.dumps(obj,indent=2)+"\n")
          doc=pathlib.Path("docs/orchestration/DIAL_SHARED_PROJECT_MEMORY_REVIEW_FABRIC.md")
          marker="## 18. Repository integration"
          text=doc.read_text()
          if marker not in text:
            text += ("\n## 18. Repository integration\n\n"
                     "SPMRF is layered on the owner-authorized Hermes full-Commander control plane. "
                     "For canonical repository closure the two governed changes are merged as one dependency-ordered PR stack; "
                     "this does not change their separate runtime authority boundaries.\n")
            doc.write_text(text)
          PY

          git add             docs/project-state/authorizations/auth-20260921-owner-spmrf-pr40-consolidation.json             docs/orchestration/DIAL_SHARED_PROJECT_MEMORY_REVIEW_FABRIC.md

          python3 scripts/project_truth_local.py record
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(truth): authorize canonical SPMRF PR consolidation"
          python3 scripts/project_truth_local.py verify
          git push origin "HEAD:refs/heads/$TARGET"
