name: FFDRM scorecard refresh
on:
  push:
    branches: [gpt/ffdrm-development-system-rebase-20260922]
permissions:
  contents: write
concurrency:
  group: ffdrm-scorecard-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate measured build-readiness scorecard fields
        run: node agent-system/bin/scorecard-refresh.mjs
      - name: Prove regenerated scorecard is current
        run: node agent-system/bin/scorecard-refresh.mjs --check
      - name: Refresh final-audit manifest only when content drifted
        run: |
          if node agent-system/bin/manifest-write.mjs --check; then
            echo "Manifest already current"
          else
            node agent-system/bin/manifest-write.mjs
          fi
      - name: Prove regenerated manifest is current
        run: node agent-system/bin/manifest-write.mjs --check
      - name: Commit canonical derived audit artifacts when changed
        run: |
          scorecard=docs/dial/final-audit/00_MASTER/BUILD_READINESS_SCORECARD.json
          manifest=docs/dial/final-audit/MANIFEST_v2_2.json
          if git diff --quiet -- "$scorecard" "$manifest"; then
            echo "Audit artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$scorecard" "$manifest"
          git commit -m "chore(audit): refresh readiness scorecard and manifest"
          git push origin HEAD:gpt/ffdrm-development-system-rebase-20260922
