name: Dial Control zero-touch converge

on:
  push:
    branches:
      - master
      - gpt/netcup-hermes-control-integrated-20260921
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dial-control-zero-touch-converge
  cancel-in-progress: false

env:
  DIAL_EXPECTED_BOOTSTRAP_REF: 17dce8e76bb80093bc14ceab9db1f97d80acfcf3
  DIAL_CONTROL_OIDC_URL: http://62.83.35.103:9134/v1/action
  OCI_CLI_USER: ${{ secrets.OCI_RECOVERY_USER_OCID }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_RECOVERY_TENANCY_OCID }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_RECOVERY_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_RECOVERY_PRIVATE_KEY }}
  OCI_CLI_REGION: ${{ vars.OCI_RECOVERY_REGION }}
  OCI_RECOVERY_COMPARTMENT_OCID: ${{ vars.OCI_RECOVERY_COMPARTMENT_OCID }}
  OCI_INSTANCE_OLD_CONTROL: ${{ vars.OCI_INSTANCE_DIAL_HERMES_CONTROL }}
  OCI_INSTANCE_VEKL_WORKER: ${{ vars.OCI_INSTANCE_VEKL_WORKER }}
  OCI_INSTANCE_ORACLE_ADMIN: ${{ vars.OCI_INSTANCE_ORACLE_ADMIN }}
  OCI_INSTANCE_VAN_TRADING_CORE: ${{ vars.OCI_INSTANCE_VAN_TRADING_CORE }}

jobs:
  converge:
    if: ${{ github.repository == 'Vanguduza/dial-new' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout authoritative revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Assert current convergence authority
        shell: bash
        run: bash deploy/netcup/hermes-control/assert-authoritative-workflow.sh

      - id: status
        name: Detect Dial Control readiness
        shell: bash
        run: |
          set -euo pipefail
          body='{"action":"status"}'
          RESPONSE=
          ready=false
          for attempt in $(seq 1 120); do
            if RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh "$body" 2>"$RUNNER_TEMP/status.err")" &&
               jq -e --arg expected "$DIAL_EXPECTED_BOOTSTRAP_REF" '
                 .ok == true and
                 .result.host == "dial-control" and
                 .result.bootstrap_receipt == true and
                 .result.bootstrap_phase == "CONTROL_PLANE_READY" and
                 .result.bootstrap_ref == $expected and
                 .result.repo_head == $expected
               ' <<<"$RESPONSE" >/dev/null 2>&1; then
              ready=true
              break
            fi
            stage="$(jq -r '.result.bootstrap_stage // "listener-unreachable"' <<<"${RESPONSE:-{}}" 2>/dev/null || echo listener-unreachable)"
            failure="$(jq -r '.result.bootstrap_failure // empty' <<<"${RESPONSE:-{}}" 2>/dev/null || true)"
            if [[ "$stage" == FAILED* || -n "$failure" ]]; then
              echo "::error::BOOTSTRAP_TERMINAL_FAILURE stage=$stage"
              if [[ -n "$failure" ]]; then
                printf '%s\n' "$failure" | tail -n 240
              fi
              exit 2
            fi
            echo "Waiting for hardened Dial Control image bootstrap (attempt $attempt/120, stage=$stage)..."
            sleep 30
          done
          if [[ "$ready" != true ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Dial Control did not become ready within the zero-touch convergence window."
            exit 1
          fi
          printf '%s' "$RESPONSE" >"$RUNNER_TEMP/status.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "certified=$(jq -r '.result.certified // false' "$RUNNER_TEMP/status.json")" >> "$GITHUB_OUTPUT"
          {
            echo "bootstrap_ssh_public_key<<EOF"
            jq -r '.result.bootstrap_ssh_public_key' "$RUNNER_TEMP/status.json"
            echo "EOF"
            echo "wireguard_public_key=$(jq -r '.result.wireguard_public_key' "$RUNNER_TEMP/status.json")"
            echo "age_recipient=$(jq -r '.result.github_bootstrap_age_recipient' "$RUNNER_TEMP/status.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Waiting for image bootstrap
        if: ${{ steps.status.outputs.ready != 'true' }}
        run: echo "ZERO_TOUCH_STATE=WAITING_FOR_DIAL_CONTROL"

      - name: Already certified
        if: ${{ steps.status.outputs.ready == 'true' && steps.status.outputs.certified == 'true' }}
        run: echo "ZERO_TOUCH_STATE=ALREADY_CERTIFIED" >> "$GITHUB_STEP_SUMMARY"

      - id: prerequisites
        name: Validate recovery material
        if: ${{ steps.status.outputs.ready == 'true' && steps.status.outputs.certified != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in             OCI_CLI_USER OCI_CLI_TENANCY OCI_CLI_FINGERPRINT OCI_CLI_KEY_CONTENT             OCI_CLI_REGION OCI_RECOVERY_COMPARTMENT_OCID OCI_INSTANCE_OLD_CONTROL             OCI_INSTANCE_VEKL_WORKER OCI_INSTANCE_ORACLE_ADMIN OCI_INSTANCE_VAN_TRADING_CORE
          do
            [[ -n "${!name:-}" ]] || { echo "::error::Required OCI recovery material is missing: $name"; exit 2; }
          done
          [[ "${{ steps.status.outputs.wireguard_public_key }}" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "::error::Invalid Dial Control WireGuard public key"; exit 2; }
          [[ "${{ steps.status.outputs.age_recipient }}" == age1* ]] || { echo "::error::Invalid Dial Control age recipient"; exit 2; }
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install pinned OCI CLI and age
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-cli"
          "$RUNNER_TEMP/oci-cli/bin/pip" install --disable-pip-version-check --no-cache-dir 'oci-cli==3.93.0'
          echo "$RUNNER_TEMP/oci-cli/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      - name: Configure ephemeral OCI identity
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" >"$HOME/.oci/recovery.pem"
          chmod 0600 "$HOME/.oci/recovery.pem"
          cat >"$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$HOME/.oci/recovery.pem
          EOF
          chmod 0600 "$HOME/.oci/config"
          oci iam region list --limit 1 >/dev/null

      - name: Reassert authority before estate mutation
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: bash deploy/netcup/hermes-control/assert-authoritative-workflow.sh

      - name: Deliver encrypted OCI recovery identity to Dial Control
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        env:
          AGE_RECIPIENT: ${{ steps.status.outputs.age_recipient }}
        run: |
          set -euo pipefail
          jq -n             --arg user "$OCI_CLI_USER"             --arg tenancy "$OCI_CLI_TENANCY"             --arg fingerprint "$OCI_CLI_FINGERPRINT"             --arg region "$OCI_CLI_REGION"             --arg private_key "$OCI_CLI_KEY_CONTENT"             '{user:$user,tenancy:$tenancy,fingerprint:$fingerprint,region:$region,private_key:$private_key}'             >"$RUNNER_TEMP/oci-bundle.json"
          age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/oci-bundle.age" "$RUNNER_TEMP/oci-bundle.json"
          CIPHERTEXT="$(base64 -w0 "$RUNNER_TEMP/oci-bundle.age")"
          BODY="$(jq -cn --arg c "$CIPHERTEXT" '{action:"install-oci-recovery-bundle",ciphertext_b64:$c}')"
          bash deploy/netcup/hermes-control/github-oidc-call.sh "$BODY" >/dev/null
          shred -u "$RUNNER_TEMP/oci-bundle.json" "$RUNNER_TEMP/oci-bundle.age" 2>/dev/null || rm -f "$RUNNER_TEMP/oci-bundle.json" "$RUNNER_TEMP/oci-bundle.age"

      - id: peers
        name: Enroll all Oracle peers through OCI Run Command
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        env:
          NETCUP_WG_PUBLIC_KEY: ${{ steps.status.outputs.wireguard_public_key }}
          NETCUP_BOOTSTRAP_SSH_PUBLIC_KEY: ${{ steps.status.outputs.bootstrap_ssh_public_key }}
        run: |
          set -euo pipefail
          SCRIPT_B64="$(base64 -w0 deploy/oracle/resource-fabric/zero-touch-enroll-peer.sh)"
          WG_B64="$(printf '%s' "$NETCUP_WG_PUBLIC_KEY" | base64 -w0)"
          SSH_B64="$(printf '%s' "$NETCUP_BOOTSTRAP_SSH_PUBLIC_KEY" | base64 -w0)"
          declare -A INSTANCE_IDS=(
            [oracle-admin]="$OCI_INSTANCE_ORACLE_ADMIN"
            [vekl-worker]="$OCI_INSTANCE_VEKL_WORKER"
            [van-trading-core]="$OCI_INSTANCE_VAN_TRADING_CORE"
            [old-dial-hermes-control]="$OCI_INSTANCE_OLD_CONTROL"
          )
          declare -A KEYS=()
          for HOST_ID in oracle-admin vekl-worker van-trading-core old-dial-hermes-control; do
            INSTANCE_ID="${INSTANCE_IDS[$HOST_ID]}"
            CMD="set -Eeuo pipefail; printf '%s' '$SCRIPT_B64' | base64 -d >/tmp/dial-zero-touch-enroll.sh; chmod 700 /tmp/dial-zero-touch-enroll.sh; DIAL_HOST_ID='$HOST_ID' NETCUP_PUBLIC_IP='62.83.35.103' NETCUP_WG_PUBLIC_KEY=\$(printf '%s' '$WG_B64' | base64 -d) NETCUP_BOOTSTRAP_SSH_PUBLIC_KEY=\$(printf '%s' '$SSH_B64' | base64 -d) bash /tmp/dial-zero-touch-enroll.sh"
            CONTENT="$RUNNER_TEMP/content-$HOST_ID.json"
            TARGET="$RUNNER_TEMP/target-$HOST_ID.json"
            jq -n --arg text "$CMD" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"}}' >"$CONTENT"
            jq -n --arg instance "$INSTANCE_ID" '{instanceId:$instance}' >"$TARGET"
            COMMAND_ID="$(oci instance-agent command create               --compartment-id "$OCI_RECOVERY_COMPARTMENT_OCID"               --content "file://$CONTENT"               --target "file://$TARGET"               --timeout-in-seconds 300               --query data.id --raw-output)"
            STATE=ACCEPTED
            EXEC_JSON=
            for _ in $(seq 1 60); do
              EXEC_JSON="$(oci instance-agent command-execution get --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID")"
              STATE="$(jq -r '.data."lifecycle-state"' <<<"$EXEC_JSON")"
              case "$STATE" in
                SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;;
              esac
              sleep 5
            done
            [[ "$STATE" == SUCCEEDED ]] || { echo "::error::OCI peer enrollment failed for $HOST_ID: $STATE"; exit 3; }
            EXIT_CODE="$(jq -r '.data.content."exit-code" // -1' <<<"$EXEC_JSON")"
            [[ "$EXIT_CODE" == 0 ]] || { echo "::error::Peer enrollment returned exit code $EXIT_CODE for $HOST_ID"; exit 3; }
            OUTPUT="$(jq -r '.data.content.text // ""' <<<"$EXEC_JSON")"
            PUB="$(grep '^DIAL_WG_PUBLIC_KEY=' <<<"$OUTPUT" | tail -1 | cut -d= -f2-)"
            [[ "$PUB" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "::error::Invalid peer public key for $HOST_ID"; exit 3; }
            KEYS[$HOST_ID]="$PUB"
          done
          {
            echo "oracle_admin=${KEYS[oracle-admin]}"
            echo "vekl_worker=${KEYS[vekl-worker]}"
            echo "van_trading_core=${KEYS[van-trading-core]}"
            echo "old_control=${KEYS[old-dial-hermes-control]}"
          } >>"$GITHUB_OUTPUT"

      - name: Install state-aware housekeeping on final Oracle estate
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/dial-housekeeping-bundle"
          rm -rf "$BUNDLE"
          mkdir -p             "$BUNDLE/agent-system/orchestration"             "$BUNDLE/agent-system/registries"             "$BUNDLE/deploy/oracle/hermes-codex/systemd"
          cp agent-system/orchestration/state-store.mjs "$BUNDLE/agent-system/orchestration/"
          cp agent-system/orchestration/resource-lifecycle-registry.mjs "$BUNDLE/agent-system/orchestration/"
          cp agent-system/orchestration/housekeeping-gc.mjs "$BUNDLE/agent-system/orchestration/"
          cp agent-system/registries/HOUSEKEEPING_POLICY.json "$BUNDLE/agent-system/registries/"
          cp deploy/oracle/hermes-codex/install-state-aware-housekeeping.sh "$BUNDLE/deploy/oracle/hermes-codex/"
          cp deploy/oracle/hermes-codex/systemd/dial-housekeeping.service "$BUNDLE/deploy/oracle/hermes-codex/systemd/"
          cp deploy/oracle/hermes-codex/systemd/dial-housekeeping.path "$BUNDLE/deploy/oracle/hermes-codex/systemd/"
          cp deploy/oracle/hermes-codex/systemd/dial-housekeeping.timer "$BUNDLE/deploy/oracle/hermes-codex/systemd/"
          tar -C "$BUNDLE" -czf "$RUNNER_TEMP/dial-housekeeping.tar.gz" .
          BUNDLE_B64="$(base64 -w0 "$RUNNER_TEMP/dial-housekeeping.tar.gz")"

          declare -A INSTANCE_IDS=(
            [oracle-admin]="$OCI_INSTANCE_ORACLE_ADMIN"
            [vekl-worker]="$OCI_INSTANCE_VEKL_WORKER"
            [van-trading-core]="$OCI_INSTANCE_VAN_TRADING_CORE"
          )

          for HOST_ID in oracle-admin vekl-worker van-trading-core; do
            INSTANCE_ID="${INSTANCE_IDS[$HOST_ID]}"
            case "$HOST_ID" in
              oracle-admin) ACTIVE_REPO=/opt/dial-recovery/dial-new ;;
              vekl-worker|van-trading-core) ACTIVE_REPO=/home/ubuntu/dial-new ;;
            esac
            CMD="set -Eeuo pipefail; if ! command -v lsof >/dev/null 2>&1; then apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lsof=4.95.0-1build3; fi; rm -rf /tmp/dial-housekeeping-bundle; mkdir -p /tmp/dial-housekeeping-bundle; printf '%s' '$BUNDLE_B64' | base64 -d | tar -xz -C /tmp/dial-housekeeping-bundle; chown -R ubuntu:ubuntu /tmp/dial-housekeeping-bundle; sudo -u ubuntu env DIAL_REPO_DIR=/tmp/dial-housekeeping-bundle DIAL_HOUSEKEEPING_ACTIVE_REPO='$ACTIVE_REPO' DIAL_HOUSEKEEPING_HOST_ID='$HOST_ID' DIAL_SERVICE_USER=ubuntu XDG_RUNTIME_DIR=/run/user/\$(id -u ubuntu) bash /tmp/dial-housekeeping-bundle/deploy/oracle/hermes-codex/install-state-aware-housekeeping.sh; rm -rf /tmp/dial-housekeeping-bundle"
            CONTENT="$RUNNER_TEMP/hk-content-$HOST_ID.json"
            TARGET="$RUNNER_TEMP/hk-target-$HOST_ID.json"
            jq -n --arg text "$CMD" '{source:{sourceType:"TEXT",text:$text},output:{outputType:"TEXT"}}' >"$CONTENT"
            jq -n --arg instance "$INSTANCE_ID" '{instanceId:$instance}' >"$TARGET"
            COMMAND_ID="$(oci instance-agent command create               --compartment-id "$OCI_RECOVERY_COMPARTMENT_OCID"               --content "file://$CONTENT"               --target "file://$TARGET"               --timeout-in-seconds 600               --query data.id --raw-output)"
            STATE=ACCEPTED
            EXEC_JSON=
            for _ in $(seq 1 120); do
              EXEC_JSON="$(oci instance-agent command-execution get --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID")"
              STATE="$(jq -r '.data."lifecycle-state"' <<<"$EXEC_JSON")"
              case "$STATE" in
                SUCCEEDED|FAILED|TIMED_OUT|CANCELED) break ;;
              esac
              sleep 5
            done
            [[ "$STATE" == SUCCEEDED ]] || { echo "::error::Housekeeping install failed for $HOST_ID: $STATE"; exit 4; }
            EXIT_CODE="$(jq -r '.data.content."exit-code" // -1' <<<"$EXEC_JSON")"
            OUTPUT="$(jq -r '.data.content.text // ""' <<<"$EXEC_JSON")"
            [[ "$EXIT_CODE" == 0 ]] || { echo "::error::Housekeeping install exit $EXIT_CODE for $HOST_ID"; echo "$OUTPUT"; exit 4; }
            grep -q 'STATE_AWARE_HOUSEKEEPING=INSTALLED' <<<"$OUTPUT" || { echo "::error::Housekeeping receipt missing for $HOST_ID"; exit 4; }
          done

      - name: Configure and verify private overlay
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -cn             --arg admin "${{ steps.peers.outputs.oracle_admin }}"             --arg vekl "${{ steps.peers.outputs.vekl_worker }}"             --arg trading "${{ steps.peers.outputs.van_trading_core }}"             --arg old "${{ steps.peers.outputs.old_control }}"             '{action:"configure-overlay",peers:{oracle_admin:$admin,vekl_worker:$vekl,van_trading_core:$trading,old_control:$old}}')"
          bash deploy/netcup/hermes-control/github-oidc-call.sh "$BODY" >/dev/null
          bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"verify-overlay"}' >/dev/null

      - name: Reassert authority before migration prepare
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: bash deploy/netcup/hermes-control/assert-authoritative-workflow.sh

      - name: Prepare migration while old control remains authoritative
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        run: bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"migrate-prepare"}' >/dev/null

      - name: Prove takeover readiness before quiescing old control
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        run: bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"activation-preflight"}' >/dev/null

      - name: Rotate one-time identities and reverify overlay
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"rotate-identities"}' >/dev/null
          bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"verify-overlay"}' >/dev/null

      - name: Reassert authority before final cutover
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: bash deploy/netcup/hermes-control/assert-authoritative-workflow.sh

      - name: Final migration cutover
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        run: bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"migrate-cutover"}' >/dev/null

      - name: Reassert authority before activation
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: bash deploy/netcup/hermes-control/assert-authoritative-workflow.sh

      - name: Activate Dial Control
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        run: bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"activate"}' >/dev/null

      - name: Optionally register self-hosted GitHub admin runner
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        continue-on-error: true
        run: bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"ensure-github-admin-runner"}' >/dev/null

      - name: Reassert authority before certification
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: bash deploy/netcup/hermes-control/assert-authoritative-workflow.sh

      - name: Final zero-touch certification
        if: ${{ steps.prerequisites.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(bash deploy/netcup/hermes-control/github-oidc-call.sh '{"action":"certify"}')"
          jq -e '.ok == true and .result.github_oidc_admin == true' <<<"$RESPONSE" >/dev/null
          {
            echo "## Dial Control zero-touch convergence"
            echo "- state: CERTIFIED"
            echo "- GitHub OIDC admin: GREEN"
            echo "- Oracle WireGuard/SSH: GREEN"
            echo "- Hermes migration/cutover: GREEN"
            echo "- old Oracle control deletion: separate retirement gate"
          } >>"$GITHUB_STEP_SUMMARY"
